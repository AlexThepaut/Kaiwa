  ];
  const STAGE_NAME = ['', 'graine', 'pousse', 'tige', 'arbuste', 'arbre'];
  function gHash(s){ let h = 0; s = String(s); for (let i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) >>> 0; } return h; }
  function gSpecies(id){ return SPECIES[gHash(id) % SPECIES.length]; }
  const G_SEED = '<ellipse class="g-seedbed" cx="0" cy="0" rx="6" ry="2.6"/><ellipse cx="0" cy="-2" rx="2.4" ry="3.2" fill="#8A6B4A"/>';
  function gShadow(rx, ry, o){ return `<ellipse class="g-shadow" cx="0" cy="1" rx="${rx}" ry="${ry}" opacity="${o}"/>`; }
  // Un végétal, dessiné autour de (0,0) ; viewBox conseillée "-30 -66 60 72".
  function plantArt(stage, sp){
    if (stage <= 1) return G_SEED;
    if (stage === 2) return '<path d="M0 0 V-16" stroke="#4F7F55" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M0 -16 c-9 0 -13 -6 -12 -12 c8 -1 12 4 12 12z" fill="#6E9E6A"/><path d="M0 -11 c9 0 13 -6 12 -12 c-8 -1 -12 4 -12 12z" fill="#4F7F55"/>';
    if (stage === 3) return gShadow(9, 2.6, .16) + '<path d="M0 0 V-30" stroke="#4F7F55" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M0 -30 c-9 0 -13 -6 -12 -12 c8 -1 12 4 12 12z" fill="#6E9E6A"/><path d="M0 -25 c9 0 13 -6 12 -12 c-8 -1 -12 4 -12 12z" fill="#4F7F55"/><path d="M0 -21 c-9 0 -13 -6 -12 -12 c8 -1 12 4 12 12z" fill="#6E9E6A"/><path d="M0 -16 c9 0 13 -6 12 -12 c-8 -1 -12 4 -12 12z" fill="#4F7F55"/><path d="M0 -12 c-9 0 -13 -6 -12 -12 c8 -1 12 4 12 12z" fill="#6E9E6A"/><path d="M0 -7 c9 0 13 -6 12 -12 c-8 -1 -12 4 -12 12z" fill="#4F7F55"/>';
    if (stage === 4) return gShadow(13, 3.4, .18) + '<path d="M0 0 C1 -10 -1 -20 0 -30" stroke="#6B5640" stroke-width="3" stroke-linecap="round" fill="none"/><ellipse cx="0" cy="-36" rx="14" ry="10" fill="#4F7F55"/><ellipse cx="-8" cy="-30" rx="8" ry="6" fill="#6E9E6A"/><ellipse cx="9" cy="-31" rx="8" ry="6" fill="#6E9E6A"/>';
    sp = sp || SPECIES[0];
    if (sp.k === 'pin') return gShadow(16, 4, .2) + '<path d="M0 0 C2 -10 -2 -22 0 -30" stroke="#6B5640" stroke-width="4" stroke-linecap="round" fill="none"/><ellipse cx="0" cy="-30" rx="17" ry="6.5" fill="#2F5A3C"/><ellipse cx="2" cy="-40" rx="13" ry="5.5" fill="#3B6B48"/><ellipse cx="-1" cy="-49" rx="9" ry="5" fill="#2F5A3C"/>';
    const c = sp.c;
    return gShadow(16, 4, .2) + `<path d="M0 0 C3 -14 -3 -28 0 -40" stroke="#6B5640" stroke-width="4" stroke-linecap="round" fill="none"/><circle cx="0" cy="-48" r="12" fill="${c[0]}"/><circle cx="-11" cy="-42" r="9" fill="${c[1]}"/><circle cx="11" cy="-43" r="9" fill="${c[2]}"/><circle cx="-4" cy="-56" r="8" fill="${c[3]}"/><circle cx="6" cy="-55" r="8" fill="${c[4]}"/>`;
  }
  const G_STONE_ART = '<ellipse class="g-shadow" cx="2" cy="1" rx="17" ry="4" opacity=".22"/><path class="g-stone" d="M-12 0 c-3 -14 8 -22 18 -19 c10 3 14 14 11 19 c-4 4 -24 4 -29 0z"/><path class="g-stone-hi" d="M-4 -14 c4 -5 11 -6 15 -3 c-5 0 -10 2 -13 6z"/>';
  const G_MOSS_ART = '<path d="M-14 0 c4 -5 14 -6 20 -4 c8 1 12 3 10 5 c-8 3 -26 3 -30 -1z" fill="#6E9E6A"/>';
  const G_LANTERN_ART = '<ellipse class="g-shadow" cx="0" cy="1" rx="12" ry="3" opacity=".2"/><rect x="-8" y="-5" width="16" height="5" rx="1" class="g-stone"/><rect x="-2.5" y="-17" width="5" height="12" fill="#A39D90"/><rect x="-7" y="-27" width="14" height="10" rx="1" fill="#A39D90"/><rect x="-3" y="-25" width="6" height="6" fill="#E8B34A"/><path d="M-12 -27 L0 -37 L12 -27z" fill="#7A7468"/><circle cx="0" cy="-39" r="2.2" class="g-stone"/>';

  function monthKeyOf(dateStr){ return String(dateStr || '').slice(0, 7); }
  function monthLabel(mk){
    const d = new Date(Number(mk.slice(0, 4)), Number(mk.slice(5, 7)) - 1, 1);
    const s = d.toLocaleDateString('fr-FR', { month: 'long' });
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function monthJp(mk){ return Number(mk.slice(5, 7)) + '月'; }
  function prevMonthKey(mk){ const y = Number(mk.slice(0, 4)), m = Number(mk.slice(5, 7)); return m === 1 ? `${y-1}-12` : `${y}-${String(m-1).padStart(2,'0')}`; }
  function nextMonthKey(mk){ const y = Number(mk.slice(0, 4)), m = Number(mk.slice(5, 7)); return m === 12 ? `${y+1}-01` : `${y}-${String(m+1).padStart(2,'0')}`; }
  function relDay(dateStr){
    const t = todayStr();
    if (dateStr === t) return 'Aujourd\'hui';
    if (dateStr === addDays(t, -1)) return 'Hier';
    if (dateStr > addDays(t, -7) && dateStr < t){
      const d = new Date(dateStr + 'T12:00:00');
      const s = d.toLocaleDateString('fr-FR', { weekday: 'long' });
      return s.charAt(0).toUpperCase() + s.slice(1);
    }
    return new Date(dateStr + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  }

  // Leçons lues d'un mois, de la plus ancienne à la plus récente. extraReadId : leçon à compter comme lue (juste terminée).
  function gardenLessons(mk, extraReadId, withoutId){
    const genki = (window.__kgGarden || []).filter(e => monthKeyOf(e.date) === mk);
    return allEntryDocs
      .filter(e => (e.read || e.id === extraReadId) && e.id !== withoutId && monthKeyOf(e.date) === mk)
      .concat(genki)
      .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  }
  function plantsAtLesson(k){ return k < 4 || (k % 2 === 1 && k <= 15); }
  function plantStage(p, k){ return Math.min(5, 1 + Math.floor((k - p) / 2)); }
  // Simule la croissance après n leçons (n = lessons.length).
  function simulatePlants(lessons){
    const plants = [];
    lessons.forEach((l, k) => { if (plantsAtLesson(k) && plants.length < G_SLOTS.length) plants.push({ id: l.id, p: k, slot: plants.length, title: l.title, date: l.date }); });
    const n = lessons.length;
    plants.forEach(pl => { pl.stage = plantStage(pl.p, n - 1); pl.species = gSpecies(pl.id); });
    return plants;
  }
  function gardenModel(mk, opts){
    opts = opts || {};
    const lessons = gardenLessons(mk, opts.extraReadId, opts.withoutId);
    const plants = simulatePlants(lessons);
    const ms = allMissions.filter(m => m && m.completed && monthKeyOf(m.date) === mk);
    const scenes = ms.filter(m => m.type !== 'free').length;
    const free = ms.filter(m => m.type === 'free').length;
    const days = Object.keys(allActivity).filter(d => monthKeyOf(d) === mk && hasActivity(allActivity[d])).length;
    const lantern = allEvals.some(e => e.completed && monthKeyOf(e.date) === mk);
    return {
      mk, lessons, plants, stones: Math.min(G_STONES.length, scenes), scenes, free,
      rockMoss: free >= 1, mossStones: Math.max(0, Math.min(free - 1, Math.min(G_STONES.length, scenes))),
      rings: Math.max(1, Math.min(6, 1 + Math.floor(days / 4))), waves: Math.min(6, 1 + Math.floor(lessons.length / 5)),
      lantern, days
    };
  }
  function slotScale(y){ return y <= 104 ? .75 : y <= 128 ? .88 : 1; }

  let gardenUid = 0;
  function gardenSvg(model, opts){
    opts = opts || {};
    const uid = 'gs' + (++gardenUid);
    let s = `<svg class="garden-svg" viewBox="0 0 340 190" role="img" aria-label="${escAttr(opts.label || 'Petit jardin zen')}"><defs><clipPath id="${uid}"><rect width="340" height="190" rx="20"/></clipPath></defs><g clip-path="url(#${uid})"><rect class="g-sand" width="340" height="190"/>`;
    const RX = [26,40,54,68,82,96], RY = [15,25,35,45,55,65];
    for (let i = 0; i < model.rings; i++) s += `<ellipse class="g-ring" cx="78" cy="102" rx="${RX[i]}" ry="${RY[i]}"/>`;
    for (let i = 0; i < model.waves; i++) s += `<path class="g-wave" d="M170 ${22 + i*12} q20 -5 40 0 t40 0 t40 0 t40 0"/>`;
    s += '<path class="g-wave" d="M0 158 H340"/><path class="g-wave" d="M0 170 q20 -4 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/><path class="g-wave" d="M0 182 q20 -4 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>';
    // le grand rocher
    s += '<ellipse class="g-shadow" cx="78" cy="110" rx="30" ry="9" opacity=".22"/><path class="g-stone" d="M50 104 c-4 -22 14 -34 30 -30 c18 4 24 22 20 34 c-6 8 -40 8 -50 -4z"/><path class="g-stone-hi" d="M62 84 c6 -8 18 -10 26 -6 c-8 0 -16 4 -22 12z"/><path class="g-stone-2" d="M92 104 c-2 -12 10 -18 18 -14 c10 4 12 14 8 20 c-6 4 -22 2 -26 -6z"/>';
    if (model.rockMoss) s += '<path d="M54 106 c8 -3 20 -2 30 2 c-10 3 -24 3 -30 -2z" fill="#6E9E6A"/>';
    if (model.lantern) s += `<g transform="translate(304 62)"><g class="${opts.newKind === 'lantern' ? 'g-new' : ''}">${G_LANTERN_ART}</g></g>`;
    // éléments triés de l'arrière vers l'avant
    const items = [];
    model.plants.forEach(pl => {
      const sl = G_SLOTS[pl.slot], sc = slotScale(sl[1]);
      items.push({ y: sl[1], html: `<g transform="translate(${sl[0]} ${sl[1]}) scale(${sc})"><g class="${opts.newId === pl.id ? 'g-new' : ''}">${plantArt(pl.stage, pl.species)}</g></g>`, pl });
    });
    for (let i = 0; i < model.stones; i++){
      const st = G_STONES[i];
      items.push({ y: st[1], html: `<g transform="translate(${st[0]} ${st[1]}) scale(${st[2]})"><g class="${opts.newKind === 'stone' && i === model.stones - 1 ? 'g-new' : ''}">${G_STONE_ART}${i < model.mossStones ? G_MOSS_ART : ''}</g></g>` });
    }
    items.sort((a, b) => a.y - b.y).forEach(it => { s += it.html; });
    // repères : graine du jour / plante qui va grandir / plante mise en avant
    if (opts.pending){
      const pd = opts.pending;
      if (pd.type === 'seed'){
        const sl = G_SLOTS[pd.slot];
        if (sl) s += `<g class="g-pulse"><circle cx="${sl[0]}" cy="${sl[1]-4}" r="8" fill="none" stroke="#C8452D" stroke-width="1.6" stroke-dasharray="3 3"/><ellipse cx="${sl[0]}" cy="${sl[1]-2}" rx="2.6" ry="3.4" fill="#C8452D"/></g>`;
      }
    }
    const ring = opts.ringId ? model.plants.find(p => p.id === opts.ringId) : (opts.pending && opts.pending.type === 'grow' ? model.plants.find(p => p.id === opts.pending.id) : null);
    if (ring){
      const sl = G_SLOTS[ring.slot], sc = slotScale(sl[1]);
      const h = ring.stage >= 5 ? 56 : ring.stage === 4 ? 40 : ring.stage === 3 ? 26 : 16;
      s += `<circle class="${opts.pending && !opts.ringId ? 'g-pulse' : ''}" cx="${sl[0]}" cy="${sl[1] - h * sc * .55}" r="${Math.max(16, h * sc * .62)}" fill="none" stroke="#C8452D" stroke-width="1.6" stroke-dasharray="3 3"/>`;
    }
    s += '</g></svg>';
    return s;
  }
  function elementTile(kind, stage, sp, w){
    w = w || 44;
    let vb = '-30 -66 60 72', art = '';
    if (kind === 'plant'){ art = plantArt(stage, sp); if (stage <= 1) vb = '-16 -26 32 30'; else if (stage === 2) vb = '-20 -40 40 46'; }
    else if (kind === 'stone'){ vb = '-24 -30 48 36'; art = G_STONE_ART; }
    else if (kind === 'moss'){ vb = '-24 -30 48 36'; art = G_STONE_ART + G_MOSS_ART; }
    else if (kind === 'lantern'){ vb = '-20 -46 40 52'; art = G_LANTERN_ART; }
    return `<svg viewBox="${vb}" width="${w}" aria-hidden="true">${art}</svg>`;
  }
  function plantNoun(pl){
    if (pl.stage >= 5) return pl.species.fr;
    return STAGE_NAME[pl.stage];
  }
  function plantNounCap(pl){ const s = plantNoun(pl); return s.charAt(0).toUpperCase() + s.slice(1); }
  function plantPhrase(pl, verb){
    const fem = pl.stage >= 1 && pl.stage <= 3;
    return `${fem ? 'Une' : 'Un'} ${plantNoun(pl)}${verb ? ' ' + verb : ''}`;
  }

  // Différences entre le jardin avant/après une leçon (pour « Fin de leçon » et le journal).
  function lessonChange(lessonId){
    const mk = monthKeyOf((allEntryDocs.find(e => e.id === lessonId) || {}).date || todayStr());
    const after = simulatePlants(gardenLessons(mk, lessonId));
    const before = simulatePlants(gardenLessons(mk, null, lessonId));
    let grown = null, planted = null;
    after.forEach(pl => {
      const pre = before.find(b => b.id === pl.id);
      if (!pre) { planted = pl; return; }
      if (pre.stage !== pl.stage){
        const better = !grown || pl.stage > grown.pl.stage || (pl.stage === grown.pl.stage && pl.p < grown.pl.p);
        if (better) grown = { pl, from: pre.stage };
      }
    });
    return { mk, grown, planted, after, before };
  }
  function daysBetween(a, b){ return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000); }

  // Prochain geste de la leçon à venir : planter une graine, ou faire grandir une plante.
  function pendingHint(mk){
    const lessons = gardenLessons(mk);
    const now = simulatePlants(lessons);
    const k = lessons.length;
    if (plantsAtLesson(k) && now.length < G_SLOTS.length) return { type: 'seed', slot: now.length };
    const grow = now.filter(p => p.stage < 5 && plantStage(p.p, k) !== p.stage).sort((a, b) => b.stage - a.stage || a.p - b.p)[0];
    if (grow) return { type: 'grow', id: grow.id };
    return null;
  }

  // ---------- Écran « Mon jardin » ----------
  let gardenUi = { mk: null, tab: 'month' };
  function monthsAvailable(){
    const cur = monthKeyOf(todayStr());
    const set = new Set([cur]);
    allEntryDocs.forEach(e => { if (e.read) set.add(monthKeyOf(e.date)); });
    return Array.from(set).sort();
  }
  function feedFor(mk){
    const rows = [];
    const lessons = gardenLessons(mk);
    lessons.forEach((l, k) => {
      const prev = simulatePlants(lessons.slice(0, k)), cur = simulatePlants(lessons.slice(0, k + 1));
      const lt = plainJp(l.title || '');
      cur.forEach(pl => {
        const pre = prev.find(b => b.id === pl.id);
        if (!pre) rows.push({ date: l.date, seq: k * 2, tile: elementTile('plant', 1, null, 40), t: 'Une graine a été plantée', s: `Leçon ${lt}` });
      });
      let best = null;
      cur.forEach(pl => { const pre = prev.find(b => b.id === pl.id); if (pre && pre.stage !== pl.stage && (!best || pl.stage > best.stage || (pl.stage === best.stage && pl.p < best.p))) best = pl; });
      if (best) rows.push({ date: l.date, seq: k * 2 + 1, tile: elementTile('plant', best.stage, best.species, 44), t: plantPhrase(best, 'a grandi'), s: `Leçon ${lt}` });
    });
    allMissions.filter(m => m && m.completed && monthKeyOf(m.date) === mk).forEach((m, i) => {
      const free = m.type === 'free';
      rows.push({ date: m.date, seq: 100 + i, tile: elementTile(free ? 'moss' : 'stone', 1, null, 44), t: free ? 'De la mousse a poussé' : 'Une pierre est apparue', s: free ? 'Discussion libre' : `Mission ${plainJp(m.title || '')}` });
    });
    const ev = allEvals.filter(e => e.completed && monthKeyOf(e.date) === mk).sort((a, b) => a.date < b.date ? -1 : 1)[0];
    if (ev) rows.push({ date: ev.date, seq: 200, tile: elementTile('lantern', 1, null, 40), t: 'Une lanterne s\'est allumée', s: 'Bilan de la semaine' });
    rows.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.seq - a.seq);
    return rows;
  }
  function gardenCountLabel(model){
    const n = model.plants.length;
    return `${monthLabel(model.mk)} · ${n} pousse${n > 1 ? 's' : ''}`;
  }
  function renderGardenView(){
    const host = document.getElementById('view-garden');
    if (!host) return;
    const cur = monthKeyOf(todayStr());
    if (!gardenUi.mk) gardenUi.mk = cur;
    const mk = gardenUi.mk;
    const months = monthsAvailable();
    const model = gardenModel(mk);
    const isCur = mk === cur;
    let body = '';
    const sel = model.plants.slice().sort((a, b) => b.stage - a.stage || a.p - b.p)[0];
    const grownCount = sel ? Math.floor((model.lessons.length - 1 - sel.p) / 2) : 0;
    if (gardenUi.tab === 'month'){
      const feed = feedFor(mk).slice(0, 8);
      body = `
        <div class="z-card" style="padding:0;border:none;background:none">${gardenSvg(model, { label: 'Ton jardin de ' + monthLabel(mk).toLowerCase(), pending: (isCur && allEntryDocs[0] && !allEntryDocs[0].read) ? pendingHint(mk) : null })}</div>
        ${sel ? `<div class="z-card selected-card"><div class="tile-sand">${elementTile('plant', sel.stage, sel.species, 60)}</div><div><b>${plantPhrase(sel)}</b><span>Née de la leçon ${escHtml(plainJp(sel.title || ''))}. ${grownCount > 0 ? `Elle a grandi ${grownCount} fois.` : 'Elle vient d\'être plantée.'}</span></div></div>` : `<div class="z-card" style="margin-top:14px"><p style="margin:0;color:var(--ink-soft)">Le sable est tout lisse. Ta première leçon plantera la première graine.</p></div>`}
        ${feed.length ? `<h2 class="sec-title" style="margin-top:24px">Derniers changements</h2><div class="feed">${feed.map(f => `
          <div class="feed-row"><div class="tile-sand">${f.tile}</div><div class="fb"><div class="ft">${f.t}</div><div class="fs">${escHtml(f.s)}</div></div><div class="fd">${escHtml(relDay(f.date))}</div></div>`).join('')}</div>` : ''}`;
    } else {
      const all = months.slice();
      const nxt = nextMonthKey(all[all.length - 1]);
      body = `<h2 class="sec-title" style="margin-top:4px">Un jardin par mois</h2>
        <div class="months">${all.slice().reverse().map(m => {
          const mm = gardenModel(m);
          return `<button type="button" class="mo" data-mk="${m}">${gardenSvg(mm, { label: 'Jardin de ' + monthLabel(m) })}<b>${monthLabel(m)}</b><span>${m === cur ? 'En cours' : 'Terminé'}</span></button>`;
        }).join('')}
          <div class="mo next"><div class="ph"></div><b>${monthLabel(nxt)}</b><span>À venir</span></div></div>`;
    }
    host.innerHTML = `
      <div class="gh-top"><button type="button" class="icon-btn" id="garden-back" aria-label="Retour">${SVG_BACK}</button><span class="jp">庭</span><h1>Mon jardin${isCur ? ' d\'' : ' de '}${monthLabel(mk).toLowerCase()}</h1></div>
      <div class="seg"><button type="button" data-tab="month" class="${gardenUi.tab === 'month' ? 'on' : ''}">${monthLabel(mk)}</button><button type="button" data-tab="months" class="${gardenUi.tab === 'months' ? 'on' : ''}">Mois précédents</button></div>
      ${body}`;
    host.querySelector('#garden-back').addEventListener('click', () => showView('home'));
    host.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { gardenUi.tab = b.dataset.tab; renderGardenView(); }));
    host.querySelectorAll('.mo[data-mk]').forEach(b => b.addEventListener('click', () => { gardenUi.mk = b.dataset.mk; gardenUi.tab = 'month'; renderGardenView(); window.scrollTo({ top: 0 }); }));
  }

  // ---------- Fin de leçon ----------
  function renderDoneView(lessonId){
    const host = document.getElementById('view-done');
    if (!host) return;
    const e = allEntryDocs.find(x => x.id === lessonId) || {};
    const ch = lessonChange(lessonId);
    const model = gardenModel(ch.mk, { extraReadId: lessonId });
    const hi = ch.grown ? ch.grown.pl : ch.planted;
    let card;
    if (ch.grown){
      const pl = ch.grown.pl, was = Object.assign({}, pl, { stage: ch.grown.from });
      const age = daysBetween(pl.date, e.date || todayStr());
      card = `<div class="z-card grow-card"><h2>${plantPhrase(pl, 'a grandi')}</h2><p>Il est né de la leçon ${escHtml(plainJp(pl.title || ''))}${age > 0 ? `, il y a ${age} jour${age > 1 ? 's' : ''}` : ''}.</p>
        <div class="grow-pair"><div class="gp"><div class="tile-sand">${elementTile('plant', was.stage, was.species, 66)}</div>${plantNounCap(was)}</div><span class="arrow">→</span><div class="gp new"><div class="tile-sand">${elementTile('plant', pl.stage, pl.species, 66)}</div>${plantNounCap(pl)}</div></div></div>`;
    } else if (ch.planted){
      card = `<div class="z-card grow-card"><h2>Une graine a été plantée</h2><p>Elle vient de ta leçon ${escHtml(plainJp(ch.planted.title || ''))}. Elle poussera avec les prochaines.</p>
        <div class="grow-pair"><div class="gp new"><div class="tile-sand">${elementTile('plant', 1, null, 66)}</div>Graine</div></div></div>`;
    } else {
      card = `<div class="z-card grow-card"><h2>Le jardin se repose</h2><p>Tout ce qui pouvait pousser a poussé. Tes cartes et tes missions le feront encore changer.</p></div>`;
    }
    const extra = (ch.grown && ch.planted) ? `<p class="quiet" style="margin-top:12px">Et une nouvelle graine a été plantée.</p>` : '';
    host.innerHTML = `
      <div class="done-head"><div><p class="eyebrow">Leçon terminée</p><h1>お疲れさま</h1><div style="color:var(--ink-soft)">Bien joué pour aujourd'hui.</div></div><div class="hanko">済</div></div>
      <div class="z-card" style="padding:0;border:none;background:none">${gardenSvg(model, { newId: ch.grown ? ch.grown.pl.id : (ch.planted ? ch.planted.id : null), ringId: hi ? hi.id : null, label: 'Ton jardin après la leçon' })}</div>
      ${card}${extra}
      <div class="stack"><button type="button" class="btn-primary" id="done-home">Retour à l'accueil</button><button type="button" class="btn-secondary" id="done-garden">Voir mon jardin</button></div>

  function suggestedScene(){
    const counts = {}; SCENARIOS.forEach(s => { counts[s.k] = 0; });
    allEntryDocs.forEach(e => { if (e.read) counts[scenarioOf(e)] += 1; });
    allMissions.forEach(m => { if (m && m.completed) counts[scenarioOf(m)] += 2; });
    const done = new Set(allMissions.filter(m => m.completed && m.sceneId).map(m => m.sceneId));
    const order = SCENARIOS.map(s => s.k).sort((a, b) => counts[a] - counts[b]);
    for (const k of order){
      const sc = SCENES.find(s => s.scenario === k && !done.has(s.id));

  function stepperSegments(){
    const n = lessonUi.exercises.length;
    const total = n + 1;
    let on = 1;
    if (lessonUi.step === 'ex') on = 1 + lessonUi.idx + 1;
    if (lessonUi.step === 'ex' && on > total) on = total;
    let html = '';
    for (let i = 0; i < total; i++) html += `<i class="${i < on ? 'on' : ''}"></i>`;
    return html;
  }

  function stepSync(){
    const root = document.getElementById('lesson-root');
    if (!root) return;
    const L = lessonUi, n = L.exercises.length;
    const learn = document.getElementById('step-learn'), ex = document.getElementById('step-ex'), foot = document.getElementById('step-foot');
    const count = document.getElementById('flow-count'), bar = document.getElementById('flow-bar');
    const bon = document.getElementById('step-bonus');
    if (L.step === 'bonus'){
      learn.style.display = 'none'; ex.style.display = 'none'; bon.style.display = '';
      bonusRender();
      return;
    }
    bon.style.display = 'none';
    if (bar) bar.innerHTML = stepperSegments();
    learn.style.display = L.step === 'learn' ? '' : 'none';
    ex.style.display = L.step === 'ex' ? '' : 'none';
    if (L.step === 'learn'){
      if (count) count.textContent = 'Dialogue';
      if (L.read){
        foot.innerHTML = `<button type="button" class="btn-primary" id="foot-home">Retour à l'accueil</button>${L.hasBonus ? `<button type="button" class="btn-secondary" id="foot-bonus" style="margin-top:10px">Bonus : écoute et dictée</button>` : ''}`;
        foot.querySelector('#foot-home').addEventListener('click', () => showView('home'));
        const fb0 = foot.querySelector('#foot-bonus'); if (fb0) fb0.addEventListener('click', bonusStart);
      } else {
        foot.innerHTML = `<button type="button" class="btn-primary" id="foot-next">${n ? 'Passer aux exercices' : 'Terminer la leçon'}</button>`;
        foot.querySelector('#foot-next').addEventListener('click', () => {
          if (!n) { finishLesson(); return; }
          const firstTodo = L.exercises.findIndex((x, i) => !(L.results[exerciseId(x, i)] && L.results[exerciseId(x, i)].attempted));
          L.step = 'ex'; L.idx = firstTodo === -1 ? n - 1 : firstTodo;
          stepSync(); window.scrollTo({ top: 0 });
        });
      }
      return;
    }
    // exercices
    ex.querySelectorAll('.exercise-item').forEach(el => { el.style.display = Number(el.dataset.i) === L.idx ? '' : 'none'; });
    if (count) count.textContent = `${L.idx + 1} / ${n}`;
    const cur = L.exercises[L.idx], res = L.results[exerciseId(cur, L.idx)];
    const attempted = !!(res && res.attempted);
    const last = L.idx >= n - 1;
    const allDone = L.exercises.every((x, i) => L.results[exerciseId(x, i)] && L.results[exerciseId(x, i)].attempted);
    if (!attempted){ foot.innerHTML = ''; return; }
    foot.innerHTML = `<button type="button" class="btn-primary" id="foot-cont">${last ? (allDone ? 'Terminer la leçon' : 'Continuer') : 'Continuer'}</button>${(last && allDone && L.hasBonus) ? `<button type="button" class="btn-secondary" id="foot-bonus" style="margin-top:10px">Bonus : écoute et dictée</button>` : ''}`;
    const fb1 = foot.querySelector('#foot-bonus'); if (fb1) fb1.addEventListener('click', bonusStart);
    foot.querySelector('#foot-cont').addEventListener('click', () => {
      if (!last){
        // saute les exercices déjà tentés pour rester sur l'actuel non fait le plus proche
        L.idx += 1; stepSync(); window.scrollTo({ top: 0 }); return;
      }
      if (allDone) finishLesson();
      else {
        const nextTodo = L.exercises.findIndex((x, i) => !(L.results[exerciseId(x, i)] && L.results[exerciseId(x, i)].attempted));
        L.idx = nextTodo === -1 ? 0 : nextTodo; stepSync(); window.scrollTo({ top: 0 });
      }
    });
  }

  async function finishLesson(){
    const L = lessonUi;
    if (!L.id || L.read){ showView('home'); return; }
    const btn = document.getElementById('foot-cont') || document.getElementById('foot-next');
    if (btn){ btn.disabled = true; btn.textContent = '…'; }
    const iso = new Date().toISOString();
    try{
      await entriesRef.doc(L.id).update({ read: true, readAt: iso });
    }catch(e){
      if (btn){ btn.disabled = false; btn.textContent = 'Terminer la leçon'; }
      return;
    }
    recordActivity('lesson');
    const ent = allEntryDocs.find(x => x.id === L.id);
    if (ent){ ent.read = true; ent.readAt = iso; }
    L.read = true; L.rendered = false;
    renderDoneView(L.id);
    showView('done');
  }

  function renderCard(entry, isLatest){
    const id = entry.id;

    const L = lessonUi;
    if (L.id === id && L.rendered && L.read === !!d.read){ L.d = d; return; }   // ne casse pas l'étape en cours à chaque sauvegarde
    const isRead = !!d.read;
    const exercises = getExercises(d);
    const results = getExerciseResults(d);
    const keepStep = (L.id === id && L.read === isRead);
    lessonUi = { id, d, step: keepStep ? L.step : 'learn', idx: keepStep ? L.idx : 0, results: keepStep && L.results ? Object.assign(results, L.results) : results, exercises, rendered: true, read: isRead, hasBonus: bonusItems(d).length > 0, bonus: null };
    const total = exercises.length;
    const exHtml = exercises.map((ex, idx) => {
      const r = lessonUi.results[exerciseId(ex, idx)];
      const inner = (r && r.attempted) ? buildAlreadyAttemptedExerciseHtml(ex, idx, total, r) : (isRead ? buildAlreadyAttemptedExerciseHtml(ex, idx, total, { answer: '—', feedback: '' }) : buildExerciseHtml(ex, idx, total));

  // ================= v16 · exercices bonus (écoute, dictée, paires) =================
  // Générés côté page à partir du dialogue et du vocabulaire de la leçon ; ils ne comptent jamais pour valider la leçon.
  function readingOf(html){
    return String(html || '').replace(/<ruby>([\s\S]*?)<rt>([\s\S]*?)<\/rt><\/ruby>/g, '$2').replace(/<[^>]+>/g, '');
  }
  function normJp(s){ return String(s || '').replace(/[\s　、。，．,.!?！？・「」『』〜~…ー-]/g, '').toLowerCase(); }
  function shortFr(s){ return String(s || '').split(/[(,;—]/)[0].trim(); }
  function bonusItems(d){
    if (!ttsSupported) return [];
    const items = [];
    const lines = (d.dialogue || []).map((t, i) => ({ t, i, plain: plainJp(t.jp) })).filter(o => o.plain.length >= 4 && o.plain.length <= 34 && o.t.fr);
    const byLen = lines.slice().sort((a, b) => Math.abs(a.plain.length - 12) - Math.abs(b.plain.length - 12) || a.i - b.i);
    const dict = byLen.slice(0, 2);
    dict.forEach((o, k) => items.push({ id: 'dictee' + k, type: 'dictee', jpHtml: o.t.jp, plain: o.plain, kana: readingOf(o.t.jp), fr: o.t.fr }));
    const ec = byLen.filter(o => !dict.includes(o))[0] || byLen[dict.length] || null;
    if (ec){
      const pool = [];
      (d.dialogue || []).forEach(t => { if (t.fr && t.fr !== ec.t.fr) pool.push(t.fr); });
      allEntryDocs.slice(0, 8).forEach(e => (e.dialogue || []).forEach(t => { if (e.id !== d.id && t.fr && t.fr !== ec.t.fr && t.fr.length < 90) pool.push(t.fr); }));
      const uniq = Array.from(new Set(pool));
      const dis = shuffle(uniq).slice(0, 2);
      if (dis.length >= 2) items.push({ id: 'ecoute0', type: 'ecoute', jpHtml: ec.t.jp, plain: ec.plain, fr: ec.t.fr, choices: shuffle([ec.t.fr].concat(dis)) });
    }
    const vocab = (d.vocab || []).filter(v => v.jp && v.fr);
    if (vocab.length >= 4){
      const pick = vocab.slice(0, 4).map(v => ({ jpHtml: v.jp, jp: plainJp(v.jp), fr: shortFr(v.fr) }));
      items.push({ id: 'paires0', type: 'paires', pairs: pick });
    }
    return items;
  }

  const BONUS_LABEL = { dictee: 'Dictée', ecoute: 'Écoute', paires: 'Associe' };
  function audioCardHtml(){
    return `<div class="audio-card"><button type="button" class="audio-big" id="audio-play" aria-label="Écouter">${SVG_SPEAKER}</button>
      <div class="audio-speeds"><button type="button" class="pill primary" data-mul="1">Normal</button><button type="button" class="pill" data-mul="0.65">Lent</button></div>
      <p class="audio-note">Tu peux réécouter autant que tu veux.</p></div>`;
  }
  function wireAudio(root, text){
    let mul = 1;
    const play = root.querySelector('#audio-play');
    const speeds = root.querySelectorAll('[data-mul]');
    const go = () => speakJp(text, play, mul);
    play.addEventListener('click', go);
    speeds.forEach(b => b.addEventListener('click', () => {
      mul = Number(b.dataset.mul);
      speeds.forEach(x => x.classList.toggle('primary', x === b));
      go();
    }));
    setTimeout(go, 250);
  }

  function bonusSave(){
    const L = lessonUi;
    if (!L.id || !entriesRef || !L.bonus) return;
    try{ Promise.resolve(entriesRef.doc(L.id).update({ suppResults: JSON.parse(JSON.stringify(L.bonus.results)) })).catch(() => {}); }catch(e){}
  }

  function bonusStart(){
    const L = lessonUi;
    if (!L.bonus) L.bonus = { items: bonusItems(L.d), idx: 0, results: Object.assign({}, (L.d && L.d.suppResults) || {}) };
    L.bonus.idx = 0;
    L.prevStep = L.step;
    L.step = 'bonus';

  // Rend l'exercice bonus courant dans #step-bonus ; renvoie l'état du pied de page.
  function bonusRender(){
    const L = lessonUi, B = L.bonus;
    const host = document.getElementById('step-bonus'), foot = document.getElementById('step-foot');
    const n = B.items.length;
    const count = document.getElementById('flow-count'), bar = document.getElementById('flow-bar');
    if (bar) bar.innerHTML = B.items.map((x, i) => `<i class="${i <= B.idx ? 'on' : ''}"></i>`).join('');
    const leave = () => { L.step = L.read ? 'learn' : 'ex'; if (L.step === 'ex') L.idx = L.exercises.length - 1; stepSync(); window.scrollTo({ top: 0 }); };
    if (B.idx >= n){
      if (count) count.textContent = 'Bonus';
      host.innerHTML = `<div class="done-head"><div><p class="eyebrow">Bonus terminé</p><h1 class="h-serif" style="font-size:34px">いい耳!</h1></div><div class="hanko sm">耳</div></div>
        <div class="z-card"><p style="margin:0;color:var(--ink-soft)">Tes oreilles s'entraînent. Ces exercices ne comptent pas pour terminer la leçon : ils sont là pour le plaisir.</p></div>`;
      foot.innerHTML = L.read ? `<button type="button" class="btn-primary" id="b-home">Retour à l'accueil</button>` : `<button type="button" class="btn-primary" id="b-finish">Terminer la leçon</button>`;
      const h = foot.querySelector('#b-home'); if (h) h.addEventListener('click', () => showView('home'));
      const f = foot.querySelector('#b-finish'); if (f) f.addEventListener('click', () => finishLesson());
      return;
    }
    const it = B.items[B.idx];
    if (count) count.textContent = `Bonus ${B.idx + 1} / ${n}`;
    const next = () => { B.idx += 1; bonusRender(); window.scrollTo({ top: 0 }); };
    const done = (ok, extraHtml) => {
      B.results[it.id] = { correct: ok, at: new Date().toISOString() };
      bonusSave();
      foot.innerHTML = `<button type="button" class="btn-primary" id="b-next">${B.idx >= n - 1 ? 'Continuer' : 'Suivant'}</button>`;
      foot.querySelector('#b-next').addEventListener('click', next);
    };
    foot.innerHTML = '';
    if (it.type === 'dictee'){
      host.innerHTML = `<p class="eyebrow">Bonus · dictée</p><h1 class="h-serif q-title">Écoute, puis écris ce que tu entends.</h1>
        ${audioCardHtml()}
        <div class="ex-input-row"><input type="text" id="dict-in" placeholder="En japonais (kana ou kanji)…" autocomplete="off" lang="ja"></div>
        <div class="stack"><button type="button" class="ex-check-btn" id="dict-check">Vérifier</button><button type="button" class="pill" id="dict-peek">${SVG_EYE}<span>Voir la transcription</span></button></div>
        <div class="ex-feedback" id="dict-fb" style="display:none"></div>`;
      wireAudio(host, it.plain);
      const inp = host.querySelector('#dict-in'), fb = host.querySelector('#dict-fb');
      const reveal = (ok, title, body) => {
        fb.className = 'ex-feedback ' + (ok === true ? 'correct' : '');
        fb.innerHTML = `<div class="fb-title">${title}</div><div class="dict-answer">${sanitizeRuby(it.jpHtml)}</div><div style="color:var(--ink-soft)">${escHtml(it.fr)}</div>${body || ''}`;
        fb.style.display = 'block';
        inp.disabled = true; host.querySelector('#dict-check').disabled = true; host.querySelector('#dict-peek').disabled = true;
        done(ok);
      };
      host.querySelector('#dict-check').addEventListener('click', () => {
        const v = normJp(inp.value);
        if (!v) return;
        const ok = v === normJp(it.plain) || v === normJp(it.kana);
        reveal(ok, ok ? 'Exact !' : 'Presque !', ok ? '' : `<p style="margin:8px 0 0">Tu avais écrit « ${escHtml(inp.value)} ». Réécoute en regardant la phrase : repère ce qui diffère.</p>`);
      });
      host.querySelector('#dict-peek').addEventListener('click', () => reveal(null, 'Transcription'));
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') host.querySelector('#dict-check').click(); });
    } else if (it.type === 'ecoute'){
      host.innerHTML = `<p class="eyebrow">Bonus · écoute</p><h1 class="h-serif q-title">Écoute, puis choisis ce que tu as entendu.</h1>
        ${audioCardHtml()}
        <div class="ex-choices">${it.choices.map(c => `<button type="button" class="ex-choice ec" data-c="${escAttr(c)}" style="font-family:var(--sans);font-size:17px">${escHtml(c)}</button>`).join('')}</div>
        <div class="stack"><button type="button" class="pill" id="ec-peek">${SVG_EYE}<span>Voir la transcription</span></button></div>
        <div class="ex-feedback" id="ec-fb" style="display:none"></div>`;
      wireAudio(host, it.plain);
      const fb = host.querySelector('#ec-fb');
      const answer = (val) => {
        const ok = val === it.fr;
        host.querySelectorAll('.ec').forEach(b => { b.disabled = true; if (b.dataset.c === it.fr) b.classList.add('correct'); else if (b.dataset.c === val) b.classList.add('incorrect'); });
        fb.className = 'ex-feedback ' + (ok ? 'correct' : '');
        fb.innerHTML = `<div class="fb-title">${ok ? 'Exact !' : (val ? 'Presque !' : 'Transcription')}</div><div class="dict-answer">${sanitizeRuby(it.jpHtml)}</div>`;
        fb.style.display = 'block';
        host.querySelector('#ec-peek').disabled = true;
        done(val ? ok : null);
      };
      host.querySelectorAll('.ec').forEach(b => b.addEventListener('click', () => answer(b.dataset.c)));
      host.querySelector('#ec-peek').addEventListener('click', () => answer(''));
    } else if (it.type === 'paires'){
      const left = it.pairs.map((p, i) => ({ i, html: p.jpHtml }));
      const right = shuffle(it.pairs.map((p, i) => ({ i, txt: p.fr })));
      host.innerHTML = `<p class="eyebrow">Bonus · associe</p><h1 class="h-serif q-title">Relie chaque mot à sa traduction.</h1>
        <p class="sec-sub">Touche un mot, puis sa traduction.</p>
        <div class="pairs-grid"><div class="pairs-col">${left.map(o => `<button type="button" class="pair-btn jp" data-side="l" data-i="${o.i}">${sanitizeRuby(o.html)}</button>`).join('')}</div>
        <div class="pairs-col">${right.map(o => `<button type="button" class="pair-btn" data-side="r" data-i="${o.i}">${escHtml(o.txt)}</button>`).join('')}</div></div>
        <p class="pairs-count" id="pairs-count">0 paire sur ${it.pairs.length}</p>`;
      let sel = null, found = 0, errors = 0;
      host.querySelectorAll('.pair-btn').forEach(b => b.addEventListener('click', () => {
        if (b.classList.contains('matched')) return;
        if (!sel){ sel = b; b.classList.add('sel'); return; }
        if (sel === b){ b.classList.remove('sel'); sel = null; return; }
        if (sel.dataset.side === b.dataset.side){ sel.classList.remove('sel'); sel = b; b.classList.add('sel'); return; }
        if (sel.dataset.i === b.dataset.i){
          [sel, b].forEach(x => { x.classList.remove('sel'); x.classList.add('matched'); });
          found += 1; sel = null;
          host.querySelector('#pairs-count').textContent = `${found} paire${found > 1 ? 's' : ''} sur ${it.pairs.length}`;
          if (found === it.pairs.length) done(errors === 0 ? true : (errors <= 2 ? true : false));
        } else {
          errors += 1;
          const a = sel, c = b; a.classList.add('wrong'); c.classList.add('wrong');
          setTimeout(() => { a.classList.remove('wrong', 'sel'); c.classList.remove('wrong'); }, 450);
          sel = null;
        }
      }));
    }
  }

  // ================= Fiche mot / décorticage des kanji =================
  // Toucher un mot japonais (n'importe où, sauf boutons / réponses) ouvre une fiche : lecture, audio, sens,
  // puis chaque kanji (sens, lectures, composants, histoire mnémotechnique). Les infos sont demandées à
  // Claude au premier tap puis mémorisées dans `kanjiinfo/` (un doc par kanji) et `wordinfo/` (un doc par mot).
  const KANJI_RE = /[㐀-鿿々]/;
  const JP_RE = /[぀-ヿ㐀-鿿々ー]/;
  const KZ_SKIP = 'button, a, input, textarea, select, label, summary, .ex-choice, .pair-btn, .flashcard, [data-notap], .masthead, #viewnav, .sheet-back, .garden-open, .tile, .link-row, .scene-tile, .stamp, .kz-chip';
  const KZ_SKIP_IN = 'rt, rp, .reading, .romaji, .fr, .tts-btn, button, svg, script, style, .who, .ex-label, .msg-corr';
  const KZ = { kanji: {}, words: {}, cur: null, editing: null, inflight: {}, kanjiRef: null, wordRef: null, busy: {} };
  let kjSession = null;

  function kzKanjiId(ch){ return 'k_' + ch.codePointAt(0).toString(16); }
  function kzWordId(t){ return 'x_' + Array.from(t).map(c => c.codePointAt(0).toString(16)).join('-'); }
  function kzFragile(){ return Object.keys(KZ.kanji).map(k => KZ.kanji[k]).filter(k => k && k.fragile && k.char); }

  function kzInit(db){
    try{
      KZ.kanjiRef = db.collection('kanjiinfo');
      KZ.wordRef = db.collection('wordinfo');
      KZ.kanjiRef.onSnapshot(qs => {
        const m = {};
        qs.docs.forEach(s => { m[s.id] = s.data(); });
        KZ.kanji = Object.assign({}, KZ.kanji, m);
        try{ renderHomeView(); }catch(e){}
        if (document.getElementById('kz-back') && document.getElementById('kz-back').classList.contains('open') && !KZ.editing) kzRender();
        if (currentView === 'cards' && !reviewSession && !kjSession) { try{ refreshReviewPanel(); }catch(e){} }
      }, () => {});
      KZ.wordRef.onSnapshot(qs => {
        const m = {};
        qs.docs.forEach(s => { m[s.id] = s.data(); });
        KZ.words = Object.assign({}, m);
      }, () => {});
    }catch(e){ /* best-effort */ }
  }

  // mots déjà connus via le vocabulaire des leçons / les cartes (lecture + sens fiables)
  function kzKnown(text){
    const hit = (arr, getJp) => arr.find(x => plainJp(getJp(x)) === text);
    for (const e of allEntryDocs){
      const v = hit(e.vocab || [], x => x.jp || '');
      if (v) return { reading: plainJp(v.reading || '') || '', fr: v.fr || '' };
    }
    const c = hit(allFlashcards, x => x.jp || '');
    if (c) return { reading: c.reading || '', fr: c.fr || '' };
    return null;
  }

  // ---------- repérer le mot touché ----------
  function kzBlockOf(el){
    let n = el;
    while (n && n !== document.body){
      let d = 'block';
      try{ d = window.getComputedStyle(n).display; }catch(e){}
      if (d !== 'inline' && d !== 'inline-block' && d !== 'contents' && d !== 'ruby' && d !== 'ruby-text' && d !== 'ruby-base') return n;
      n = n.parentElement;
    }
    return el;
  }
  function kzUnits(root){
    const units = [];
    (function walk(n){
      n.childNodes.forEach(c => {
        if (c.nodeType === 3){ units.push({ text: c.data, nodes: [c], read: null, el: null }); return; }
        if (c.nodeType !== 1) return;
        if (c.matches && c.matches(KZ_SKIP_IN) && c.tagName !== 'RT') return;
        if (c.tagName === 'RT' || c.tagName === 'RP') return;
        if (c.tagName === 'RUBY'){
          let base = '', rt = ''; const nodes = [];
          c.childNodes.forEach(k => {
            if (k.nodeType === 3){ base += k.data; nodes.push(k); }
            else if (k.tagName === 'RT') rt += k.textContent;
            else if (k.tagName !== 'RP') base += k.textContent;
          });
          units.push({ text: base, nodes, read: rt, el: c });
          return;
        }
        walk(c);
      });
    })(root);
    let pos = 0;
    units.forEach(u => { u.start = pos; pos += u.text.length; u.end = pos; });
    return { units, plain: units.map(u => u.text).join('') };
  }
  function kzCaret(e){
    try{
      if (document.caretPositionFromPoint){
        const p = document.caretPositionFromPoint(e.clientX, e.clientY);
        if (p && p.offsetNode) return { node: p.offsetNode, off: p.offset };
      }
      if (document.caretRangeFromPoint){
        const r = document.caretRangeFromPoint(e.clientX, e.clientY);
        if (r) return { node: r.startContainer, off: r.startOffset };
      }
    }catch(err){}
    return null;
  }
  function kzCharUnder(node, off, x, y){
    // le caret tombe entre deux caractères : on garde celui qui est réellement sous le doigt
    const len = node.data.length;
    const cands = [off, off - 1].filter(c => c >= 0 && c < len);
    try{
      for (const c of cands){
        const r = document.createRange(); r.setStart(node, c); r.setEnd(node, c + 1);
        const b = r.getBoundingClientRect();
        if (b && b.width > 0 && x >= b.left - 1 && x <= b.right + 1 && y >= b.top - 1 && y <= b.bottom + 1) return c;
      }
    }catch(err){}
    return cands.length ? cands[0] : null;
  }
  function kzSegmentAt(plain, i){
    if (typeof Intl !== 'undefined' && Intl.Segmenter){
      try{
        const seg = new Intl.Segmenter('ja', { granularity: 'word' });
        for (const s of seg.segment(plain)){
          if (i >= s.index && i < s.index + s.segment.length) return { s: s.index, e: s.index + s.segment.length };
        }
      }catch(err){}
    }
    const kind = ch => KANJI_RE.test(ch) ? 'k' : /[゠-ヿ]/.test(ch) ? 'c' : /[぀-ゟ]/.test(ch) ? 'h' : 'o';
    const k = kind(plain[i]); let s = i, e = i + 1;
    while (s > 0 && kind(plain[s - 1]) === k) s--;
    while (e < plain.length && kind(plain[e]) === k) e++;
    return { s, e };
  }
  function kzPick(e){
    const t = e.target;
    let node = null, off = 0;
    const c = kzCaret(e);
    if (c && c.node && c.node.nodeType === 3 && (t.contains(c.node) || (c.node.parentElement && c.node.parentElement.contains(t)))){ node = c.node; off = c.off; }
    if (!node){
      const rb = t.closest('ruby');
      if (!rb) return null;
      node = Array.from(rb.childNodes).find(k => k.nodeType === 3) || rb; off = 0;
    }
    const parent = node.nodeType === 3 ? node.parentElement : node;
    if (!parent) return null;
    if (parent.closest(KZ_SKIP_IN) && !parent.closest('rt')) return null;
    const block = kzBlockOf(parent.closest('ruby') ? parent.closest('ruby').parentElement : parent);
    const { units, plain } = kzUnits(block);
    if (!plain) return null;
    const unit = units.find(u => u.nodes.includes(node) || (u.el && u.el.contains(node)));
    if (!unit) return null;
    let idx;
    if (unit.el) idx = unit.start;
    else {
      const ch = node.nodeType === 3 ? kzCharUnder(node, off, e.clientX, e.clientY) : 0;
      if (ch == null) return null;
      idx = unit.start + ch;
    }
    if (!plain[idx] || !JP_RE.test(plain[idx])) return null;
    let { s, e: en } = kzSegmentAt(plain, idx);
    // élargir aux unités complètes (un groupe furigana ne se coupe pas)
    units.forEach(u => { if (u.el && u.end > s && u.start < en){ s = Math.min(s, u.start); en = Math.max(en, u.end); } });
    const text = plain.slice(s, en).trim();
    if (!text || !JP_RE.test(text) || text.length > 14) return null;
    let reading = '', complete = true;
    units.forEach(u => {
      if (u.end <= s || u.start >= en) return;
      if (u.el) reading += u.read || '';
      else {
        const part = u.text.slice(Math.max(0, s - u.start), Math.min(u.text.length, en - u.start));
        if (KANJI_RE.test(part)) complete = false;
        reading += part;
      }
    });
    const lo = Math.max(0, s - 24), hi = Math.min(plain.length, en + 24);
    let range = null;
    try{
      const ov = units.filter(u => u.end > s && u.start < en);
      if (ov.length){
        const a = ov[0], z = ov[ov.length - 1]; range = document.createRange();
        if (a.el) range.setStartBefore(a.el); else range.setStart(a.nodes[0], Math.max(0, s - a.start));
        if (z.el) range.setEndAfter(z.el); else range.setEnd(z.nodes[0], Math.min(z.text.length, en - z.start));
      }
    }catch(err){ range = null; }
    return { text, reading: complete ? reading.replace(/\s+/g, '') : '', ctx: plain.slice(lo, hi), range };
  }

  document.addEventListener('click', (e) => {
    const t = e.target;
    if (!t || !t.closest) return;
    const direct = t.closest('[data-kz-word]');
    if (direct){ e.stopPropagation(); openWordSheet({ text: direct.dataset.kzWord, reading: direct.dataset.kzRead || '', ctx: '' }); return; }
    const chip = t.closest('[data-kj-open]');

    const hit = kzPick(e);
    if (hit) openWordSheet(hit);
  });

  // Curseur « main » au survol d'un mot japonais cliquable (souris uniquement).
  (function(){
    let busy = false, on = false;
    const hl = document.createElement('div'); hl.className = 'kz-hl'; hl.setAttribute('aria-hidden', 'true'); document.body.appendChild(hl);
    function lineBoxes(range){
      const rs = Array.from(range.getClientRects()).filter(r => r.width > 0.5 && r.height > 0.5).sort((p, q) => p.top - q.top || p.left - q.left);
      const lines = [];
      rs.forEach(r => {
        const L = lines.find(l => Math.min(l.bottom, r.bottom) - Math.max(l.top, r.top) > Math.min(l.bottom - l.top, r.height) * 0.5);
        if (L){ L.left = Math.min(L.left, r.left); L.right = Math.max(L.right, r.right); L.top = Math.min(L.top, r.top); L.bottom = Math.max(L.bottom, r.bottom); }
        else lines.push({ left: r.left, right: r.right, top: r.top, bottom: r.bottom });
      });
      return lines.sort((p, q) => p.top - q.top);
    }
    function draw(range){
      if (!range){ hl.innerHTML = ''; return; }
      const L = lineBoxes(range);
      hl.innerHTML = L.map((l, i) => {
        const first = i === 0, last = i === L.length - 1, pl = first ? 3 : 0, pr = last ? 3 : 0;
        const rad = L.length === 1 ? '7px' : first ? '7px 0 0 7px' : last ? '0 7px 7px 0' : '0';
        return '<i style="left:' + (l.left - pl) + 'px;top:' + (l.top - 1) + 'px;width:' + (l.right - l.left + pl + pr) + 'px;height:' + (l.bottom - l.top + 2) + 'px;border-radius:' + rad + '"></i>';
      }).join('');
    }
    const hideOutline = () => { hl.innerHTML = ''; };
    window.addEventListener('scroll', hideOutline, true); document.addEventListener('mouseleave', hideOutline); document.addEventListener('click', hideOutline, true);
    document.addEventListener('mousemove', (e) => {
      if (busy) return; busy = true;
      requestAnimationFrame(() => {
        busy = false;
        let hit = null;
        try{
          const t = e.target;
          if (t && t.closest && !t.closest(KZ_SKIP) && !document.body.classList.contains('kz-lock')) hit = kzPick(e);
        }catch(err){}
        if (!!hit !== on){ on = !!hit; document.documentElement.style.cursor = hit ? 'pointer' : ''; }
        draw(hit && hit.range ? hit.range : null);
      });
    }, { passive: true });
  })();

  // ---------- la fiche ----------

          <div class="kz-k-act"><button type="button" class="btn-primary kz-sm" data-kz-save="${escAttr(ch)}">Enregistrer</button><button type="button" class="btn-ghost kz-sm" data-kz-cancel>Annuler</button></div></div>`
      : `<div class="kz-story${mine ? ' mine' : ''}"><span class="kz-story-lbl">${mine ? 'Ton histoire' : 'Idée de Claude'}</span><p>${escHtml(mine || d.story || '—')}</p>

            ${mine ? `<button type="button" class="btn-ghost kz-sm" data-kz-reset="${escAttr(ch)}">Revenir à l'idée de Claude</button>` : `<button type="button" class="btn-ghost kz-sm" data-kz-regen="${escAttr(ch)}"${KZ.busy[ch] ? ' disabled' : ''}>${KZ.busy[ch] ? '…' : '↻ Autre idée'}</button>`}

    </section>`;

  // ---------- appel à Claude + mémorisation ----------
  async function kzFetch(cur){
    const chars = Array.from(new Set(Array.from(cur.text).filter(c => KANJI_RE.test(c))));
    const missing = chars.filter(c => !KZ.kanji[kzKanjiId(c)]);
    const known = kzKnown(cur.text);
    const wid = kzWordId(cur.text);
    const hasW = !!KZ.words[wid];
    const readingKnown = !!(cur.reading || (known && known.reading) || !chars.length);
    const needWord = !hasW && !(known && known.fr && readingKnown);
    if (!missing.length && !needWord){ cur.status = 'ready'; kzRender(); return; }
    const key = wid + '|' + missing.join('');
    try{
      if (!KZ.inflight[key]) KZ.inflight[key] = kzAsk(cur, missing, needWord, wid).finally(() => { delete KZ.inflight[key]; });
      await KZ.inflight[key];
      if (KZ.cur === cur) cur.status = 'ready';
    }catch(err){
      if (KZ.cur === cur){ cur.status = 'error'; cur.err = sampleErrorText(err); }
    }
    if (KZ.cur === cur) kzRender();
  }
  function kzClean(s, n){ return String(s == null ? '' : s).replace(/[<>]/g, '').trim().slice(0, n || 200); }
  function kzList(a, n){ return (Array.isArray(a) ? a : (a ? [a] : [])).map(x => kzClean(x, 40)).filter(Boolean).slice(0, n || 4); }
  async function kzJson(prompt){
    const sample = await claude.use('sample');
    if (!sample) throw { code: 'unavailable' };
    if (typeof sample.json === 'function') return await sample.json(prompt, { modelTier: 'default', cache: true });
    const res = await sample(prompt, { modelTier: 'default', cache: true });
    const m = String(res.text || '').match(/\{[\s\S]*\}/);
    if (!m) throw { code: 'parse' };
    return JSON.parse(m[0]);
  }
  async function kzAsk(cur, missing, needWord, wid){
    const prompt = `Tu aides un apprenant francophone de japonais (niveau N5, manuel Genki I) à retenir des mots et des kanji.
Mot touché : « ${cur.text} »${cur.reading ? ` (lecture indiquée : ${cur.reading})` : ''}${cur.ctx ? `, dans le texte : « ${cur.ctx} »` : ''}.

Réponds UNIQUEMENT par un objet JSON valide, sans texte autour :
{"word": ${needWord ? '{"reading":"lecture en hiragana","meaning":"sens en français, court, adapté au contexte","base":"forme du dictionnaire si le mot est conjugué, sinon chaîne vide","note":"nuance d\'usage utile en une courte phrase, ou chaîne vide"}' : 'null'},
 "kanji": [${missing.length ? '{"c":"un kanji","meaning":"sens principal en français","on":["lecture on en katakana"],"kun":["lecture kun en hiragana, okurigana après un point, ex. さが.す"],"parts":[{"c":"composant","meaning":"sens du composant en français","role":"sens ou son"}],"story":"histoire mnémotechnique"}' : ''}]}

Règles :
- "kanji" : une entrée pour chacun de ces caractères et seulement eux : ${missing.length ? missing.join(' ') : '(aucun, tableau vide)'}.
- "parts" : décomposition standard et vérifiable (radical classant puis autres composants, 1 à 3 éléments ; un seul pour un pictogramme simple). N'invente pas d'étymologie.
- "story" : en français, 1 à 2 phrases courtes et très visuelles, construites à partir des composants et du sens du kanji (idéalement reliées au sens du mot « ${cur.text} »). Une image mentale concrète, pas une explication savante.
- Lectures : celles qu'on rencontre en pratique à un niveau N5-N4, 3 au maximum par type.`;
    const r = await kzJson(prompt);
    const writes = [];
    if (needWord && r && r.word && r.word.meaning){
      const w = { text: cur.text, reading: kzClean(r.word.reading, 40), meaning: kzClean(r.word.meaning, 120), base: kzClean(r.word.base, 20), note: kzClean(r.word.note, 160), createdAt: new Date().toISOString() };
      KZ.words[wid] = w;
      writes.push(KZ.wordRef && Promise.resolve(KZ.wordRef.doc(wid).set(w)).catch(() => {}));
    }
    ((r && r.kanji) || []).forEach(k => {
      const ch = kzClean(k && k.c, 4);
      if (!ch || !missing.includes(ch) || KZ.kanji[kzKanjiId(ch)]) return;
      const d = {
        char: ch, meaning: kzClean(k.meaning, 80), on: kzList(k.on), kun: kzList(k.kun),
        parts: (Array.isArray(k.parts) ? k.parts : []).slice(0, 3).map(p => ({ c: kzClean(p && p.c, 6), meaning: kzClean(p && p.meaning, 60), role: /son|phon/i.test(p && p.role) ? 'son' : (/sens|radic|signif/i.test(p && p.role) ? 'sens' : '') })).filter(p => p.c),
        story: kzClean(k.story, 320), createdAt: new Date().toISOString()
      };
      if (!d.meaning) return;
      KZ.kanji[kzKanjiId(ch)] = d;
      writes.push(KZ.kanjiRef && Promise.resolve(KZ.kanjiRef.doc(kzKanjiId(ch)).set(d)).catch(() => {}));
    });
    await Promise.all(writes);
    if (missing.some(c => !KZ.kanji[kzKanjiId(c)]) && !(needWord && KZ.words[wid])) throw { code: 'parse' };
  }
  function kzPatchKanji(ch, patch){
    const id = kzKanjiId(ch);
    const had = !!KZ.kanji[id];
    KZ.kanji[id] = Object.assign({}, KZ.kanji[id] || { char: ch }, patch);
    if (!KZ.kanjiRef) return;
    try{
      const p = had ? KZ.kanjiRef.doc(id).update(patch) : KZ.kanjiRef.doc(id).set(KZ.kanji[id]);
      Promise.resolve(p).catch(() => {});
    }catch(err){}
  }
  async function kzRegen(ch){
    const d = KZ.kanji[kzKanjiId(ch)]; if (!d || KZ.busy[ch]) return;
    KZ.busy[ch] = true; kzRender();
    try{
      const r = await kzJson(`Kanji : ${ch} (sens : ${d.meaning}; composants : ${(d.parts || []).map(p => p.c + ' = ' + p.meaning).join(', ')}).
Propose UNE AUTRE histoire mnémotechnique en français (1 à 2 phrases courtes, image mentale très concrète, construite sur les composants), différente de celle-ci : « ${d.story || ''} ».
Réponds UNIQUEMENT par {"story":"..."}.`);
      const s = kzClean(r && r.story, 320);
      if (s) kzPatchKanji(ch, { story: s });
    }catch(err){ /* garde l'ancienne */ }
    KZ.busy[ch] = false; kzRender();
  }

  function kzSheetClick(e){
    const t = e.target.closest ? e.target : null; if (!t) return;
    const q = s => t.closest(s);
    if (q('[data-kz-close]')) { kzClose(); return; }
    if (q('[data-kz-addcard]')) { kzAddCard(); return; }
    if (q('[data-kz-retry]')) { if (KZ.cur){ KZ.cur.status = 'loading'; kzRender(); kzFetch(KZ.cur); } return; }
    let b;
    if ((b = q('[data-kz-flag]'))){
      const ch = b.dataset.kzFlag, d = KZ.kanji[kzKanjiId(ch)]; if (!d) return;
      kzPatchKanji(ch, d.fragile ? { fragile: false, ok: 0 } : { fragile: true, ok: 0, fragileAt: new Date().toISOString() });
      kzRender(); try{ renderHomeView(); }catch(err){} return;
    }
    if ((b = q('[data-kz-edit]'))){ KZ.editing = b.dataset.kzEdit; kzRender(); const ta = document.getElementById('kz-edit'); if (ta) ta.focus(); return; }
    if (q('[data-kz-cancel]')) { KZ.editing = null; kzRender(); return; }
    if ((b = q('[data-kz-save]'))){
      const ch = b.dataset.kzSave, ta = document.getElementById('kz-edit');
      const v = kzClean(ta && ta.value, 400);
      KZ.editing = null;
      kzPatchKanji(ch, v ? { userStory: v } : { userStory: '' });
      kzRender(); return;
    }
    if ((b = q('[data-kz-reset]'))){ kzPatchKanji(b.dataset.kzReset, { userStory: '' }); kzRender(); return; }
    if ((b = q('[data-kz-regen]'))){ kzRegen(b.dataset.kzRegen); return; }
  }

  // ---------- Kanji à revoir : accueil + cartes ----------
  function kzHomeCard(){
    const list = kzFragile();
    if (!list.length) return '';
    const chips = list.slice(0, 10).map(k => `<button type="button" class="word-chip kz-chip" data-kj-open="${escAttr(k.char)}"><b style="font-size:22px">${escHtml(k.char)}</b>${escHtml(k.meaning || '')}</button>`).join('');
    return `<div class="recall-card"><h3>Kanji à revoir</h3><div class="word-chips">${chips}</div>
      <button type="button" class="btn-secondary" style="margin-top:12px" data-kj-start>Les réviser (${list.length})</button></div>`;
  }
  function kzCardsBlock(){
    const list = kzFragile();
    if (!list.length) return `<div class="block"><p class="kz-hint-card">漢 Touche n'importe quel mot japonais dans une leçon pour décortiquer ses kanji. Ceux qui résistent peuvent être marqués « à revoir » : ils reviendront ici.</p></div>`;
    return `<div class="block kz-cards-block"><h3 class="kz-h3">漢 Kanji à revoir</h3>
      <div class="word-chips">${list.map(k => `<button type="button" class="word-chip kz-chip" data-kj-open="${escAttr(k.char)}"><b style="font-size:22px">${escHtml(k.char)}</b>${escHtml(k.meaning || '')}</button>`).join('')}</div>
      <button type="button" class="review-start-btn secondary" data-kj-start>Réviser ces kanji (${list.length})</button></div>`;
  }
  function buildReviewPanelHtml(){
    if (reviewSession) return sessionCardHtml();
    return buildReviewPanelHtmlBase() + kzCardsBlock();
  }

  function kjStart(){
    const list = shuffle(kzFragile().map(k => k.char));
    if (!list.length) return;
    kjSession = { queue: list, index: 0, good: 0, bad: 0, cleared: 0 };
    kzClose();
    showView('cards');
    kjRender();
  }
  function kjRender(){
    const el = document.getElementById('review-panel-el');
    if (!el || !kjSession) return;
    const s = kjSession;
    applyFocus();
    if (s.index >= s.queue.length){
      el.innerHTML = `<div class="block rv-block"><div class="done-head"><div><p class="eyebrow">Session terminée</p><h1>お疲れさま</h1></div><div class="hanko">済</div></div>
        <div class="tab-panel-intro">${s.good} retenu${s.good > 1 ? 's' : ''}, ${s.bad} encore flou${s.bad > 1 ? 's' : ''}.${s.cleared ? ` ${s.cleared} kanji ${s.cleared > 1 ? 'sortent' : 'sort'} de ta liste : bien joué !` : ''}</div>
        <button type="button" class="review-start-btn secondary" data-kj-close>戻る · Retour</button></div>`;
      el.querySelector('[data-kj-close]').addEventListener('click', () => { kjSession = null; renderCardsView(); });
      return;
    }
    const ch = s.queue[s.index], d = KZ.kanji[kzKanjiId(ch)] || { char: ch };
    const parts = (d.parts || []).map(p => `<span class="kz-part"><b>${escHtml(p.c)}</b>${escHtml(p.meaning || '')}</span>`).join('<span class="kz-plus">+</span>');
    const on = (d.on || []).join('、'), kun = (d.kun || []).join('、');
    el.innerHTML = `<div class="block rv-block">
      <div class="flow-top"><button type="button" class="icon-btn" data-kj-close aria-label="Terminer la session">${SVG_CLOSE}</button><div class="flow-bar">${s.queue.map((q, i) => `<i class="${i <= s.index ? 'on' : ''}"></i>`).join('')}</div><span class="flow-count">${s.index + 1} / ${s.queue.length}</span></div>
      <p class="eyebrow" style="text-align:center">KANJI</p>
      <div class="flashcard" id="kj-card" data-mode="kanji"><div class="flashcard-inner">
        <div class="flashcard-face front"><div class="flashcard-hint">Sens et lecture ?</div><div class="flashcard-jp" style="font-size:96px">${escHtml(ch)}</div></div>
        <div class="flashcard-face back"><div class="flashcard-jp">${escHtml(ch)}</div><div class="flashcard-fr">${escHtml(d.meaning || '')}</div>
          <div class="kz-k-read" style="justify-content:center">${on ? `<span><em>音</em>${escHtml(on)}</span>` : ''}${kun ? `<span><em>訓</em>${escHtml(kun)}</span>` : ''}</div>
          ${parts ? `<div class="kz-parts" style="justify-content:center">${parts}</div>` : ''}
          <p class="kz-story-mini">${escHtml((d.userStory || '').trim() || d.story || '')}</p></div>
      </div></div>
      <div class="tab-panel-intro" style="text-align:center;margin-top:10px">Touche la carte pour la retourner</div>
      <div class="review-grade-row" id="kj-grade" style="visibility:hidden">
        <button type="button" class="review-grade-btn bad" data-kj-grade="bad">△ Encore flou</button>
        <button type="button" class="review-grade-btn good" data-kj-grade="good">◎ Je l'ai</button>
      </div></div>`;
    el.querySelector('[data-kj-close]').addEventListener('click', () => { kjSession = null; renderCardsView(); });
    const card = el.querySelector('#kj-card');
    card.addEventListener('click', () => { card.classList.toggle('flipped'); el.querySelector('#kj-grade').style.visibility = card.classList.contains('flipped') ? 'visible' : 'hidden'; });
    el.querySelectorAll('[data-kj-grade]').forEach(b => b.addEventListener('click', (e) => {
      e.stopPropagation();
      const good = b.dataset.kjGrade === 'good';
      const ok = good ? ((KZ.kanji[kzKanjiId(ch)] || {}).ok || 0) + 1 : 0;
      if (good && ok >= 2){ kzPatchKanji(ch, { fragile: false, ok: 0 }); s.cleared++; }
      else kzPatchKanji(ch, { ok });
      recordActivity('review');
      if (good) s.good++; else s.bad++;
      s.index++;
      kjRender();
      try{ renderHomeView(); }catch(err){}
    }));
  }

  async function init(){
    const db = await claude.use('db');
    if (!db){
      cardEl.innerHTML = `<div class="state-msg">Le suivi en direct n'est pas disponible dans cette vue.<br>Ouvre cette page depuis Claude pour voir la leçon du jour.</div>`;
      return;
    }

    entriesRef = db.collection('entries');
    flashcardsRef = db.collection('flashcards');
    const progressRef = db.doc('state/progress');

    activityRef = db.collection('activity');
    missionsRef = db.collection('missions');
    evalsRef = db.collection('evaluations');
    kzInit(db);

    progressRef.onSnapshot(snap => {
      const p = snap.exists ? snap.data() : {};
      progressState = p;
      statLevel.textContent = p.currentLevel || '—';
    }, () => {});

    activityRef.onSnapshot(qs => {
      const m = {};
      qs.docs.forEach(s => { m[s.id] = s.data(); });
      allActivity = m;
      renderProgressStrip();
      if (currentView === 'bilan' && !evalUi.active) renderBilanView();
    }, () => {});
    missionsRef.orderBy('at', 'desc').limit(60).onSnapshot(qs => {
      allMissions = qs.docs.map(s => s.data());
      renderProgressStrip();
      if (currentView === 'missions') renderMissionsView();
    }, () => {});
    evalsRef.orderBy('date', 'desc').limit(12).onSnapshot(qs => {
      allEvals = qs.docs.map(s => Object.assign({ id: s.id }, s.data()));
      updateBilanDot();
      try{ renderHomeView(); }catch(e){}
      if (currentView === 'bilan' && !evalUi.active) renderBilanView();
    }, () => {});

    flashcardsRef.onSnapshot(qs => {
      allFlashcards = qs.docs.map(s => Object.assign({ id: s.id }, s.data()));
      flashcardsReady = true;
      syncVocabAddButtons();
      syncReviewBadge();
      try{ renderHomeView(); }catch(e){}
      if (!reviewSession) refreshReviewPanel();
      try{ var kb = document.getElementById('kz-back'); if (kb && kb.classList.contains('open') && !KZ.editing && KZ.cur) kzRender(); }catch(e){}
    }, () => {});

    entriesRef.orderBy('date', 'desc').limit(150).onSnapshot(qs => {
      if (qs.empty){
        cardEl.innerHTML = `<div class="state-msg">Ta première leçon arrive bientôt.</div>`;
        historyWrap.style.display = 'none';
        return;
      }
      const docs = qs.docs; // desc order, [0] = latest
      allEntryDocs = docs.map(sn => Object.assign({ id: sn.id }, sn.data()));
      renderProgressStrip();
      const latest = docs[0];
      const latestData = latest.data();
      renderCard(latest, true);
      renderHistory(docs);

      statLesson.textContent = latestData.lessonNumber || '—';
      const done = docs.filter(d => d.data().read).length;
      statDone.textContent = String(done);
    }, () => {
      cardEl.innerHTML = `<div class="state-msg">Impossible de charger la leçon pour le moment.</div>`;
    });
  }

  window.addEventListener('kg-activity', (e) => {
    try{ if (e.detail && e.detail.kind) recordActivity(e.detail.kind); }catch(_){}
    try{ renderProgressStrip(); }catch(_){}
  });
  renderProgressStrip();
  init();
})();
</script>
<script>
(function(){
  'use strict';
  var K = window.__kloc; if (!K) return;
  var css = document.createElement('style');

  css.textContent = 'html:not(.ol-on) [data-kg-help]{display:none!important}'
  + '.std-ov{position:fixed;inset:0;z-index:200;background:var(--bg,#f6f1e7);display:none;align-items:center;justify-content:center;padding:24px 20px}'

  + '.std-card h2{margin:0 0 4px;font-size:22px}.std-card .jp{font-size:34px;font-weight:900;display:block;margin-bottom:6px}'

  + '.std-btn.primary{background:var(--accent,#4d7a4a);border-color:var(--accent,#4d7a4a);color:#fff}'

  + '.std-sec{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line,#e2dccb)}.std-sec h3{margin:0 0 4px;font-size:15px}.std-sec .std-info{font-size:13px;color:var(--ink-soft,#6b6558)}';
  document.head.appendChild(css);

  function el(h){ var d = document.createElement('div'); d.innerHTML = h; return d.firstElementChild; }
  function pickFile(accept, multi){ return new Promise(function(res){ var i = document.createElement('input'); i.type = 'file'; i.accept = accept || '.json,application/json'; if (multi) i.multiple = true; i.style.display = 'none'; i.onchange = function(){ var l = i.files ? Array.prototype.slice.call(i.files) : []; res(multi ? l : (l[0] || null)); i.remove(); }; document.body.appendChild(i); i.click(); }); }
  async function importFiles(files){
    var packs = [];
    for (var k = 0; k < files.length; k++) { var p = await readJson(files[k]); if (!p || p.format !== 'kaiwa-pack') throw new Error('« ' + files[k].name + ' » n’est pas un pack Kaiwa.'); packs.push(p); }
    packs.sort(function(a, b){ return (a.kind === 'socle' ? 0 : 1) - (b.kind === 'socle' ? 0 : 1); });
    var done = [];
    for (var j = 0; j < packs.length; j++) { var r = await K.importPack(packs[j]); done.push(r.kind === 'socle' ? 'socle' : r.title); }
    if (!K.count('curriculum')) throw new Error('Il manque le socle (kaiwa_socle.json) : importe-le aussi.');
    return done;
  }
  async function readJson(f){ var t = await f.text(); return JSON.parse(t); }

  var ov = el('<div class="std-ov" id="std-import"><div class="std-card"><span class="jp">会話</span><h2>Bienvenue dans Kaiwa</h2>'
    + '<p>Cette application est vide pour l’instant : elle attend des <b>fichiers de contenu</b> (.json) reçus avec le lien : d’abord le <b>socle</b>, puis une leçon par fichier. Tu peux tous les choisir d’un coup.</p>'
    + '<button type="button" class="std-btn primary" id="std-pick">Importer le socle et les leçons</button>'

    + '<button type="button" class="std-btn" id="std-skip">Plus tard, continuer sans importer</button>'

  document.body.appendChild(ov);
  function msg(t, err){ var m = document.getElementById('std-msg'); if (m) { m.textContent = t || ''; m.className = 'std-msg' + (err ? ' err' : ''); } }
  async function doPack(){
    try { var fs = await pickFile(null, true); if (!fs.length) return; msg('Import en cours…'); var done = await importFiles(fs); msg('Importé : ' + done.join(', ') + '. Rechargement…'); setTimeout(function(){ location.reload(); }, 600); }
    catch (e) { msg(e && e.message ? e.message : 'Import impossible.', true); }
  }
  async function doBackupRestore(){
    try { var f = await pickFile(); if (!f) return; var p = await readJson(f); await K.importProgress(p); msg('Progression restaurée. Rechargement…'); setTimeout(function(){ location.reload(); }, 500); }
    catch (e) { msg(e && e.message ? e.message : 'Restauration impossible.', true); }
  }
  ov.querySelector('#std-pick').addEventListener('click', doPack);
  ov.querySelector('#std-pick-bk').addEventListener('click', doBackupRestore);
  ov.querySelector('#std-skip').addEventListener('click', function(){ try { sessionStorage.setItem('kaiwa-skip-import', '1'); } catch (e) {} ov.classList.remove('on'); });
  K.ready.then(function(){ var sk = false; try { sk = sessionStorage.getItem('kaiwa-skip-import') === '1'; } catch (e) {} if (!K.count('curriculum') && !sk) ov.classList.add('on'); });

  // ----- Réglages : contenu et sauvegarde -----
  var set = document.querySelector('#settings-back .sheet');
  if (set) {
    
    var sec = el('<div class="std-sec"><h3>Contenu et sauvegarde</h3><div class="std-info" id="std-info"></div>'
      + '<button type="button" class="std-btn" id="std-imp">Ajouter des leçons (fichiers .json)</button>'
      + '<button type="button" class="std-btn" id="std-bk">Sauvegarder ma progression</button>'
      + '<button type="button" class="std-btn" id="std-rs">Restaurer une sauvegarde</button>'
      + '<button type="button" class="std-btn warn" id="std-rz">Remettre ma progression à zéro</button>'
      + '<div class="std-msg" id="std-msg2"></div></div>');
    var closeBtn = set.querySelector('.btn-primary[data-close]');
    set.insertBefore(sec, closeBtn);
    // ----- Réglages : IA locale (Ollama) -----
    var ai = el('<div class="std-sec"><h3>IA locale (Ollama)</h3><div class="std-info">Active l’aide, les conversations, les corrections libres et les bilans. Il faut qu’Ollama soit lancé sur cet ordinateur.</div>'
      + '<label class="std-info" for="ol-url" style="display:block;margin-top:10px">Adresse d’Ollama</label><input id="ol-url" class="std-in" type="text" autocomplete="off" spellcheck="false">'
      + '<label class="std-info" for="ol-model" style="display:block;margin-top:10px">Modèle</label><select id="ol-model" class="std-in"></select>'
      + '<button type="button" class="std-btn" id="ol-detect">Détecter les modèles installés</button>'
      + '<button type="button" class="std-btn" id="ol-test">Tester la réponse en japonais</button>'
      + '<div class="std-msg" id="ol-msg"></div></div>');
    var aiCss = document.createElement('style'); aiCss.textContent = '.std-in{width:100%;box-sizing:border-box;margin-top:4px;padding:10px 12px;border-radius:10px;border:1px solid var(--line,#ccc);background:var(--bg,#fff);color:var(--ink,#222);font:inherit}'; document.head.appendChild(aiCss);
    set.insertBefore(ai, closeBtn);
    var O = K.ollama, olMsg = function(t, err){ var m = ai.querySelector('#ol-msg'); m.textContent = t || ''; m.className = 'std-msg' + (err ? ' err' : ''); };
    var urlIn = ai.querySelector('#ol-url'), modSel = ai.querySelector('#ol-model');
    urlIn.value = O.url();
    function fillModels(names){
      var cur = O.model(), list = names.slice(); if (cur && list.indexOf(cur) < 0) list.unshift(cur);

    fillModels([]);
    async function detect(quiet){

    urlIn.addEventListener('change', function(){ try { localStorage.setItem('kaiwa-ollama-url', urlIn.value.trim()); } catch (e) {} detect(); });
    modSel.addEventListener('change', function(){ try { if (modSel.value) localStorage.setItem('kaiwa-ollama-model', modSel.value); else localStorage.removeItem('kaiwa-ollama-model'); } catch (e) {} olFlag(); olMsg(modSel.value ? 'Modèle « ' + modSel.value + ' » activé.' : 'IA désactivée.'); });
    ai.querySelector('#ol-detect').addEventListener('click', function(){ detect(); });
    ai.querySelector('#ol-test').addEventListener('click', async function(){
      if (!O.model()) return olMsg('Choisis d’abord un modèle.', true);
      olMsg('Réponse en cours (le premier appel peut prendre un moment)…');
      try { var r = await O.ask('Réponds uniquement par une courte phrase en japonais pour dire bonjour, suivie de sa traduction française entre parenthèses.', {}); olMsg(r.text || '(réponse vide)'); }

    });
    K.ready.then(function(){ if (O.model()) detect(true); });
    var m2 = function(t, err){ var m = document.getElementById('std-msg2'); m.textContent = t || ''; m.className = 'std-msg' + (err ? ' err' : ''); };
    K.ready.then(function(){
      var i = K.packInfo(), inf = document.getElementById('std-info'), L = i && i.lessons ? Object.keys(i.lessons) : [];
      inf.textContent = (i && i.socle ? 'Socle installé. ' : 'Aucun socle installé. ') + (L.length ? 'Leçons : ' + L.join(', ') + '.' : 'Aucune leçon ajoutée.') + (K.disk() ? ' Tout est enregistré sur ton ordinateur (dossier « data » de Kaiwa, copie quotidienne dans « backups »).' : ' Attention : ouvre Kaiwa avec « Lancer Kaiwa.bat » pour que tout soit enregistré sur disque ; sinon seul le navigateur garde tes données, pense à sauvegarder.');
    });
    sec.querySelector('#std-imp').addEventListener('click', async function(){
      try { var fs = await pickFile(null, true); if (!fs.length) return; var done = await importFiles(fs); m2('Ajouté : ' + done.join(', ') + '. Rechargement…'); setTimeout(function(){ location.reload(); }, 600); }
      catch (e) { m2(e && e.message ? e.message : 'Import impossible.', true); }
    });
    sec.querySelector('#std-rs').addEventListener('click', async function(){
      try { var f = await pickFile(); if (!f) return; var p = await readJson(f); await K.importProgress(p); m2('Progression restaurée. Rechargement…'); setTimeout(function(){ location.reload(); }, 500); }
      catch (e) { m2(e && e.message ? e.message : 'Restauration impossible.', true); }
    });
    sec.querySelector('#std-bk').addEventListener('click', async function(){
      try {
        var o = await K.exportProgress(), txt = JSON.stringify(o), name = 'kaiwa-progression-' + new Date().toISOString().slice(0, 10) + '.json';
        var box = document.getElementById('std-bkbox'); if (box) box.remove();
        box = el('<div id="std-bkbox"><p class="std-info">Tu peux aussi copier ce texte et le garder dans une note : colle-le dans un fichier .json pour restaurer plus tard.</p><textarea class="std-ta" readonly></textarea><button type="button" class="std-btn" id="std-cp">Copier le texte</button></div>');
        box.querySelector('textarea').value = txt; sec.appendChild(box);
        box.querySelector('#std-cp').addEventListener('click', function(){ var ta = box.querySelector('textarea'); ta.select(); try { navigator.clipboard.writeText(txt); } catch (e) { try { document.execCommand('copy'); } catch (e2) {} } m2('Copié.'); });
        try {
          var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click();
          setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000); m2('Sauvegarde téléchargée (' + name + ').');
        } catch (e) { m2('Téléchargement non effectué : copie le texte ci-dessous.'); }
      } catch (e) { m2('Sauvegarde impossible.', true); }
    });
    var armed = false;
    sec.querySelector('#std-rz').addEventListener('click', async function(ev){
      if (!armed) { armed = true; ev.target.textContent = 'Confirmer : tout effacer (le contenu reste)'; setTimeout(function(){ armed = false; ev.target.textContent = 'Remettre ma progression à zéro'; }, 5000); return; }
      await K.resetProgress(); m2('Progression effacée. Rechargement…'); setTimeout(function(){ location.reload(); }, 500);
    });
  }
})();

</script>
</body></html>
