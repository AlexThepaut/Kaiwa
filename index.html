<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Kaiwa du Jour</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%233F6B4A'/%3E%3Ctext x='32' y='43' font-size='32' text-anchor='middle' fill='white' font-family='serif'%3E会%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Layout concept: a Japanese departure board — flat modern surfaces, tabular
     mono data for numbers and labels, bold gothic headlines for kanji legibility,
     one signal-blue accent with a warm amber "stamp" ink for completion. A single
     Mincho glyph in the mark is the only traditional touch, kept deliberately
     rare against otherwise crisp gothic type. */
  /* Zen redesign (v16): warm paper, ink, moss green, vermilion hanko. Light + dark. */
  :root{
    --bg: #F6F1E7;
    --surface: #FBF8F1;
    --surface-2: #EFE7D6;
    --ink: #2A2A24;
    --ink-soft: #5E5A4E;
    --ink-faint: #8A8372;
    --accent: #3F6B4A;
    --accent-deep: #3F6B4A;
    --accent-tint: #E7EEDF;
    --on-accent: #FFFFFF;
    --amber: #B23A25;
    --amber-tint: #F8EBD3;
    --good: #3F6B4A;
    --good-tint: #E7EEDF;
    --bad: #B23A25;
    --bad-tint: #F7E3DC;
    --line: #E2D8C2;
    --line-strong: #CFC4AB;
    --track: #DDD2BA;
    --vermilion: #C8452D;
    --sand: #EADFC8;
    --g-sand: #EADFC8; --g-ring: #D3C5A3; --g-wave: #D9CCAB;
    --g-stone: #8F897C; --g-stone-hi: #B5AFA2; --g-stone-2: #7F796D; --g-shadow: #7A7468; --g-seedbed: #CDBF9B;
    --shadow: none;
    --focus: #3F6B4A;
    --pad-x: 20px;
    --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --sans: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #181711; --surface: #221F18; --surface-2: #2C291F; --ink: #EFE8D8; --ink-soft: #B5AD99; --ink-faint: #877F6C;
      --accent: #86BB90; --accent-deep: #4A7B56; --accent-tint: #232E20; --on-accent: #FFFFFF;
      --amber: #E0725A; --amber-tint: #3A2C1A; --good: #86BB90; --good-tint: #232E20; --bad: #E0725A; --bad-tint: #3A211B;
      --line: #38342A; --line-strong: #4A4535; --track: #3A362B; --vermilion: #D2523A; --sand: #2E2A20;
      --g-sand: #2E2A20; --g-ring: #433D2D; --g-wave: #3D382A; --g-stone: #7C776B; --g-stone-hi: #A09B8E; --g-stone-2: #69655B; --g-shadow: #000000; --g-seedbed: #5A5240;
      --focus: #86BB90; color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg: #181711; --surface: #221F18; --surface-2: #2C291F; --ink: #EFE8D8; --ink-soft: #B5AD99; --ink-faint: #877F6C;
    --accent: #86BB90; --accent-deep: #4A7B56; --accent-tint: #232E20; --on-accent: #FFFFFF;
    --amber: #E0725A; --amber-tint: #3A2C1A; --good: #86BB90; --good-tint: #232E20; --bad: #E0725A; --bad-tint: #3A211B;
    --line: #38342A; --line-strong: #4A4535; --track: #3A362B; --vermilion: #D2523A; --sand: #2E2A20;
    --g-sand: #2E2A20; --g-ring: #433D2D; --g-wave: #3D382A; --g-stone: #7C776B; --g-stone-hi: #A09B8E; --g-stone-2: #69655B; --g-shadow: #000000; --g-seedbed: #5A5240;
    --focus: #86BB90; color-scheme: dark;
  }

  *{ box-sizing: border-box; }
  body{
    margin:0;
    background:
      radial-gradient(color-mix(in srgb, var(--line) 60%, transparent) 1px, transparent 1.4px) 0 0/22px 22px,
      var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16.5px;
    -webkit-font-smoothing: antialiased;
  }
  a{ color: var(--accent); }
  :focus-visible{ outline: 2px solid var(--focus); outline-offset: 2px; }
  .mono{ font-family: var(--sans); font-variant-numeric: tabular-nums; }

  .page{
    max-width: 920px;
    margin: 0 auto;
    padding: 40px var(--pad-x) 80px;
  }
  @media (max-width: 480px){
    .page{ padding: 28px var(--pad-x) 56px; }
    .masthead{ flex-wrap: wrap; row-gap: 12px; }
    .masthead-right{ width: 100%; }
  }

  /* ---- masthead ---- */
  .masthead{
    display:flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--ink);
  }
  .brand{ display:flex; align-items:center; gap: 13px; min-width:0; }
  .brand .mark{
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: var(--serif);
    font-weight: 700;
    font-size: 18px;
    flex: none;
  }
  .brand .word{ min-width:0; }
  .brand .wordmark{
    font-weight: 900;
    font-size: 21px;
    letter-spacing: -.01em;
    white-space: nowrap;
  }
  .brand .tagline{
    font-family: var(--sans);
    font-weight: 500;
    font-size: 10.5px;
    letter-spacing: .14em;
    color: var(--ink-faint);
    margin-top: 3px;
  }
  .masthead-right{ display:flex; flex-direction:column; align-items:flex-end; gap: 8px; }
  .masthead .date{
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: .03em;
    color: var(--ink-soft);
    white-space: nowrap;
    text-transform: uppercase;
    text-align: right;
  }
  .theme-toggle{
    display:flex;
    gap: 2px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px;
  }
  .theme-toggle button{
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
    padding: 0;
  }
  .theme-toggle button svg{ width: 14px; height: 14px; }
  .theme-toggle button:hover{ color: var(--ink); }
  .theme-toggle button.active{ background: var(--accent); color: #fff; }
  .voice-picker-row{
    display:none;
    align-items:center;
    gap: 6px;
  }
  .rate-row{
    display:none;
    align-items:center;
    gap: 6px;
    font-family: var(--sans);
    font-size: 10px;
    color: var(--ink-soft);
  }
  .rate-row input[type=range]{
    width: 84px;
    accent-color: var(--accent);
    margin: 0;
    cursor: pointer;
  }
  .rate-row .rate-val{ min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
  .voice-select{
    font-family: var(--sans);
    font-size: 10px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 8px;
    color: var(--ink-soft);
    max-width: 150px;
  }

  /* ---- stats strip ---- */
  .stats{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .stat{
    background: var(--surface);
    padding: 13px 14px 12px;
    text-align: center;
    border-top: 3px solid var(--stat-accent, var(--accent));
  }
  .stat.stat-level{ --stat-accent: var(--amber); }
  .stat.stat-done{ --stat-accent: var(--good); }
  .stat .n{
    font-family: var(--sans);
    font-weight: 700;
    font-size: 23px;
  }
  .stat .l{
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .1em;
    color: var(--ink-faint);
    margin-top: 3px;
  }

  /* ---- lesson card ---- */
  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-head{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 12px;
    padding: 15px var(--pad-x);
    background: var(--surface-2);
    border-bottom: 1px solid var(--line);
  }
  .lesson-tag{
    font-family: var(--sans);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .03em;
    color: var(--accent-deep);
  }
  .level-chip{
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    color: var(--accent-deep);
    background: var(--accent-tint);
    border-radius: 999px;
    padding: 4px 11px;
  }
  .title-row{
    padding: 22px var(--pad-x) 6px;
  }
  .jp-title{
    font-weight: 900;
    font-size: 26px;
    letter-spacing: -.01em;
    text-wrap: balance;
  }
  .situation{
    color: var(--ink-soft);
    font-size: 15px;
    margin-top: 6px;
    line-height: 1.5;
  }

  .section-label{
    padding: 18px var(--pad-x) 0;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    color: var(--accent);
  }

  .gloss-toggle{
    margin: 14px var(--pad-x) 0;
    display:flex;
    justify-content:flex-end;
  }
  .gloss-toggle button{
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent-deep);
    background: var(--accent-tint);
    border: none;
    border-radius: 999px;
    padding: 6px 13px;
    cursor: pointer;
  }
  .gloss-toggle button:hover{ background: color-mix(in srgb, var(--accent-tint) 60%, var(--accent) 18%); }

  .dialogue{
    padding: 12px var(--pad-x) 6px;
    display:flex;
    flex-direction:column;
    gap: 18px;
  }
  .turn{
    max-width: 88%;
  }
  .turn.b{ align-self:flex-end; text-align:right; }
  .speaker{
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    margin-bottom: 5px;
  }
  .turn.a .speaker{ color: var(--ink-soft); }
  .turn.b .speaker{ color: var(--accent); }
  .turn .jp-line{
    display:inline-block;
    font-weight: 700;
    font-size: 22px;
    line-height: 1.7;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 10px 14px;
  }
  .turn.b .jp-line{ background: var(--accent-tint); }
  .jp-line ruby rt{
    font-family: var(--sans);
    font-weight: 500;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .gloss{
    margin-top: 6px;
    display:none;
  }
  .show-gloss .gloss{ display:block; }
  .romaji{
    font-size: 14px;
    color: var(--ink-soft);
  }
  .fr{
    font-size: 14.5px;
    color: var(--ink-faint);
    margin-top: 2px;
  }

  .divider{
    height:1px;
    background: var(--line);
    margin: 20px var(--pad-x) 0;
  }

  .block{
    padding: 20px var(--pad-x);
  }
  .block h2{
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    color: var(--ink-faint);
    margin: 0 0 12px;
  }
  .vocab-list{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }
  .vocab-item{
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 9px;
    padding: 12px 14px 11px;
  }
  .vocab-jp{ font-weight:700; font-size:18px; }
  .vocab-jp .reading{
    display:block;
    font-family: var(--sans);
    font-weight: 400;
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 3px;
  }
  .vocab-cut{
    display:flex;
    align-items:center;
    margin: 9px 0 8px;
  }
  .vocab-cut .notch{
    flex:none;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--bg);
    border: 1.5px solid var(--line);
  }
  .vocab-cut .dash{
    flex: 1;
    border-top: 1px dashed var(--line);
    margin: 0 4px;
  }
  .jp-line-row{
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .turn.a .jp-line-row{ justify-content:flex-start; }
  .turn.b .jp-line-row{ justify-content:flex-end; }
  .vocab-jp-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap: 6px;
  }
  .tts-btn{
    display:inline-flex;
    flex: none;
    align-items:center;
    justify-content:center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: none;
    background: var(--surface-2);
    color: var(--ink-soft);
    font-size: 11px;
    cursor: pointer;
    padding: 0;
  }
  .tts-btn:hover{ background: var(--accent-tint); color: var(--accent-deep); }
  .tts-btn.speaking{ background: var(--accent); color: #fff; }
  .tts-btn-lg{
    width: 32px;
    height: 32px;
    font-size: 14px;
    background: var(--surface);
    border: 1.5px solid var(--accent);
    color: var(--accent);
  }
  .flashcard-face .tts-btn-lg{ margin-top: 12px; }
  .vocab-fr-row{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap: 8px;
  }
  .vocab-fr{
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .vocab-add-btn{
    flex: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    background: var(--surface);
    color: var(--accent);
    font-family: var(--sans);
    font-weight: 700;
    font-size: 14px;
    line-height: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
    padding: 0;
  }
  .vocab-add-btn:hover:not(.added){ background: var(--accent-tint); }
  .vocab-add-btn.added{
    border-color: var(--good);
    color: var(--good);
    cursor: default;
    background: var(--good-tint);
  }

  .grammar{
    background: var(--accent-tint);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .grammar .point{
    font-weight:700;
    color: var(--accent-deep);
    font-size: 15px;
    margin-bottom: 4px;
  }
  .grammar .note{
    font-size: 13.5px;
    color: var(--ink);
    line-height:1.5;
  }

  /* ---- cours section ---- */
  .cours-point{
    font-weight: 800;
    font-size: 22px;
    color: var(--accent-deep);
    margin-top: 6px;
  }
  .cours-explanation{
    font-size: 15.5px;
    line-height: 1.65;
    color: var(--ink);
    margin-top: 10px;
  }
  .examples{
    margin-top: 14px;
    display:flex;
    flex-direction: column;
    gap: 10px;
  }
  .example{
    display:flex;
    gap: 14px;
    align-items:flex-start;
    background: var(--surface-2);
    border-radius: 10px;
    padding: 12px 15px;
  }
  .example .ex-num{
    flex: none;
    min-width: 26px;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 21px;
    line-height: 1.4;
    color: var(--line);
  }
  .example .ex-body{ min-width: 0; flex: 1; }
  .example .jp-line{ font-weight: 700; font-size: 19px; }
  .example .romaji{ margin-top: 4px; }
  .example .fr{ margin-top: 2px; }

  /* ---- tabs: a small metro line, one station per panel ---- */
  .tabs{
    position:relative;
    display:flex;
    padding: 22px var(--pad-x) 0;
  }
  .tabs::before{
    content:'';
    position:absolute;
    left: 12.5%;
    right: 12.5%;
    top: 32px;
    height: 2px;
    background: var(--line);
  }
  .tab-btn{
    position:relative;
    z-index:1;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 7px;
    font-family: var(--sans);
    color: var(--ink-faint);
    background: none;
    border: none;
    padding: 0 4px 16px;
    cursor: pointer;
  }
  .tab-dot{
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--line);
    transition: all .15s ease;
  }
  .tab-btn.active .tab-dot{
    width: 15px;
    height: 15px;
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-tint);
  }
  .tab-jp{
    font-weight: 700;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .tab-btn.active .tab-jp{ color: var(--ink); }
  .tab-label-row{
    display:flex;
    align-items:center;
    gap: 5px;
  }
  .tab-label{
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  .tab-btn.active .tab-label{ color: var(--accent-deep); }
  .tab-badge{
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 700;
    background: var(--surface-2);
    color: var(--ink-faint);
    border-radius: 999px;
    padding: 1px 6px;
  }
  .tab-badge.done{ background: var(--good-tint); color: var(--good); }
  .tab-panel-intro{
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .exercise-item + .exercise-item{
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px dashed var(--line);
  }

  .exercise{
    margin-top: 4px;
    background: var(--accent-tint);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .exercise .ex-label{
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--accent-deep);
    margin-bottom: 8px;
  }
  .exercise .ex-prompt{
    font-size: 15.5px;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .exercise .ex-sentence{
    font-weight: 700;
    font-size: 20px;
    margin-bottom: 12px;
  }
  .ex-choices{
    display:flex;
    flex-direction: column;
    gap: 8px;
  }
  .ex-choice{
    text-align:left;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 500;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 9px;
    padding: 10px 13px;
    cursor: pointer;
    color: var(--ink);
  }
  .ex-choice:hover:not(:disabled){ border-color: var(--accent); }
  .ex-choice.correct{ border-color: var(--good); background: var(--good-tint); }
  .ex-choice.incorrect{ border-color: var(--bad); background: var(--bad-tint); }
  .ex-choice:disabled{ cursor: default; opacity: .8; }

  .ex-input-row{ display:flex; gap: 8px; flex-wrap: wrap; }
  .ex-input-row input, .ex-input-row textarea{
    flex: 1 1 200px;
    font-family: var(--sans);
    font-size: 15.5px;
    padding: 9px 12px;
    border-radius: 9px;
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--ink);
  }
  .ex-input-row textarea{ min-height: 64px; resize: vertical; }
  .ex-input-row input:focus, .ex-input-row textarea:focus{ outline:none; border-color: var(--accent); }
  .ex-check-btn{
    font-family: var(--sans);
    font-weight: 700;
    font-size: 13.5px;
    color: #fff;
    background: var(--accent-deep);
    border: none;
    border-radius: 9px;

  .grow-pair .gp .tile-sand{ height:136px; margin-bottom:6px; }
  .grow-pair .gp.new .tile-sand{ outline: 1.5px dashed var(--vermilion); outline-offset:-1.5px; }
  .grow-pair .arrow{ color: var(--ink-soft); font-size:24px; }
  .stack{ display:flex; flex-direction:column; gap:10px; margin-top:20px; }
  .quiet{ text-align:center; color: var(--ink-soft); font-size:14px; margin-top:6px; }

  /* mon jardin */
  .gh-top{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .gh-top .jp{ font-family: var(--serif); font-weight:700; font-size:30px; line-height:1; }
  .gh-top h1{ font-size:21px; font-weight:700; margin:0; }
  .seg{ display:flex; gap:10px; margin-bottom:16px; }
  .seg button{ flex:1; min-height:48px; border-radius:99px; font-family: var(--sans); font-weight:700; font-size:15.5px; cursor:pointer; border:1.5px solid var(--line-strong); background: transparent; color: var(--ink); }
  .seg button.on{ background: var(--accent-deep); color: var(--on-accent); border-color: var(--accent-deep); }
  .feed{ border-top:1.5px solid var(--line); }
  .feed-row{ display:flex; align-items:center; gap:14px; padding: 12px 0; border-bottom:1.5px solid var(--line); }
  .feed-row .tile-sand{ width:64px; height:64px; flex:none; border-radius:14px; }
  .feed-row .fb{ flex:1; min-width:0; }
  .feed-row .ft{ font-weight:700; font-size:16.5px; }
  .feed-row .fs{ font-size:14px; color: var(--ink-soft); }
  .feed-row .fd{ font-size:13.5px; color: var(--ink-soft); white-space:nowrap; align-self:flex-start; padding-top:4px; }
  .months{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
  .months .mo{ text-align:left; background:none; border:none; padding:0; cursor:pointer; font-family: var(--sans); color: var(--ink); }
  .months .mo b{ display:block; font-size:16px; margin-top:6px; }
  .months .mo span{ font-size:13.5px; color: var(--ink-soft); }
  .months .mo.next .ph{ aspect-ratio: 340/190; border:1.5px dashed var(--line-strong); border-radius:16px; }
  .selected-card{ display:flex; gap:14px; align-items:center; padding: 12px; margin: 14px 0 6px; }
  .selected-card .tile-sand{ width:78px; height:96px; flex:none; border-radius:14px; }
  .selected-card b{ font-size:19px; display:block; }
  .selected-card span{ font-size:14.5px; color: var(--ink-soft); }
  .month-sum{ display:grid; grid-template-columns: repeat(3,1fr); text-align:center; padding: 16px 8px; margin-top:16px; }
  .month-sum b{ display:block; font-family: var(--serif); font-size:32px; line-height:1.2; }
  .month-sum span{ font-size:13px; color: var(--ink-soft); }

  /* settings sheet */
  .sheet-back{ position:fixed; inset:0; background: rgba(30,28,22,.45); z-index:60; display:none; align-items:flex-end; justify-content:center; }
  .sheet-back.open{ display:flex; }
  .sheet{ background: var(--bg); width:min(520px,100%); border-radius: 28px 28px 0 0; padding: 22px 20px calc(24px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto; }
  .sheet h2{ font-size:21px; margin:0 0 14px; font-weight:700; display:flex; justify-content:space-between; align-items:center; }
  .set-row{ margin: 0 0 18px; }
  .set-row > label, .set-row > .lbl{ display:block; font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color: var(--ink-soft); margin-bottom:8px; }
  .sheet .theme-toggle{ display:flex; gap:8px; border:none; background:none; padding:0; }
  .sheet .theme-toggle button{ flex:1; min-height:48px; border-radius:14px; border:1.5px solid var(--line-strong); background: transparent; color: var(--ink); display:flex; align-items:center; justify-content:center; gap:8px; font-family: var(--sans); font-weight:700; font-size:14.5px; cursor:pointer; }
  .sheet .theme-toggle button.active{ background: var(--accent-deep); color: var(--on-accent); border-color: var(--accent-deep); }
  .sheet .theme-toggle button svg{ width:18px; height:18px; }
  .sheet .voice-picker-row{ display:flex; gap:8px; align-items:center; }
  .sheet .voice-select{ flex:1; min-height:48px; border-radius:14px; border:1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font-family: var(--sans); font-size:15px; padding: 0 12px; }
  .sheet .rate-row{ display:flex; align-items:center; gap:10px; }
  .sheet .rate-row input{ flex:1; accent-color: var(--accent-deep); min-height:44px; }

  .garden-cap span:first-child{ white-space:nowrap; }
  .garden-cap span:last-child{ font-size:13px; }
  .today-card .t-jp{ line-height:1.45; }
  .today-card.rest .t-fr{ margin-bottom:16px; }
  .masthead .brand{ min-width:0; }
  .masthead .date{ white-space:nowrap; }

  /* ================= v16 · leçon par étapes ================= */
  #card.card{ background:none; border:none; box-shadow:none; padding:0; margin:0; border-radius:0; }
  #card .state-msg{ color: var(--ink-soft); padding: 40px 0; text-align:center; }
  .lesson-h1{ font-family: var(--serif); font-weight:700; font-size:34px; line-height:1.5; margin: 6px 0 4px; }
  .lesson-h1 rt, .t-jp rt{ font-family: var(--sans); font-weight:500; }
  .lesson-sit{ color: var(--ink-soft); font-size:16px; margin: 0 0 16px; line-height:1.5; }
  .eyebrow.green{ color: var(--accent); }
  .pill-row{ display:flex; flex-wrap:wrap; gap:10px; margin: 0 0 20px; }
  .pill{ display:inline-flex; align-items:center; gap:8px; min-height:46px; padding: 0 18px; border-radius:99px; font-family: var(--sans); font-weight:700; font-size:15px; cursor:pointer; background: transparent; color: var(--ink); border:1.5px solid var(--line-strong); }
  .pill svg{ width:18px; height:18px; flex:none; }
  .pill.primary{ background: var(--accent-deep); color: var(--on-accent); border-color: var(--accent-deep); }
  .pill.on{ background: var(--accent-tint); border-color: var(--accent); }
  .step-foot{ margin-top: 24px; }
  .step-foot:empty{ display:none; }
  .step-foot .btn-primary{ position: sticky; bottom: 16px; }

  /* dialogue : bulles */
  #card .dialogue{ display:flex; flex-direction:column; gap:14px; padding:0; margin:0; background:none; border:none; }
  #card .turn{ display:flex; flex-direction:column; gap:3px; padding:0; border:none; background:none; margin:0; }
  #card .turn .speaker{ font-size:12.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color: var(--ink-soft); background:none; padding:0; margin:0 0 2px; border:none; }
  #card .turn.b .speaker{ text-align:right; }
  #card .turn .jp-line-row{ display:flex; align-items:center; gap:10px; margin:0; }
  #card .turn.b .jp-line-row{ flex-direction:row-reverse; }
  #card .turn .jp-line{ font-size:22px; font-weight:700; line-height:1.9; background: var(--surface); border:1.5px solid var(--line); border-radius: 22px; padding: 6px 18px 8px; max-width: calc(100% - 52px); margin:0; }
  #card .turn.b .jp-line{ background: var(--accent-tint); border-color: color-mix(in srgb, var(--accent) 25%, transparent); }
  #card .turn .fr{ font-size:14.5px; color: var(--ink-soft); margin: 2px 4px 0; display:block; }
  #card .turn.b .fr{ text-align:right; }
  #card .turn .romaji{ display:none; font-size:13.5px; color: var(--ink-faint); margin: 0 4px; font-style:italic; }
  #card .turn.b .romaji{ text-align:right; }
  #card .dialogue.show-romaji .romaji{ display:block; }
  #card .dialogue.hide-fr .fr{ display:none; }
  .tts-btn{ width:44px; height:44px; border-radius:50%; border:1.5px solid var(--line-strong); background: var(--surface); color: var(--accent); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; padding:0; flex:none; font-size:0; }
  .tts-btn svg{ width:20px; height:20px; }
  .tts-btn.speaking{ background: var(--accent-deep); color: var(--on-accent); }
  .tts-btn:hover{ background: var(--accent-tint); }

  /* à retenir */
  #card .vocab-list{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin:0; }
  #card .vocab-item{ background: var(--surface); border:1.5px solid var(--line); border-radius:18px; padding: 12px 14px 10px; display:flex; flex-direction:column; gap:4px; min-width:0; }
  #card .vocab-jp-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:6px; }
  #card .vocab-jp{ font-family: var(--serif); font-weight:700; font-size:26px; line-height:1.7; }
  #card .vocab-jp .reading{ display:block; font-family: var(--sans); font-size:13px; font-weight:500; color: var(--ink-faint); line-height:1.2; }
  #card .vocab-item .tts-btn{ width:36px; height:36px; }
  #card .vocab-item .tts-btn svg{ width:17px; height:17px; }
  #card .vocab-cut{ display:none; }
  #card .vocab-fr-row{ display:flex; justify-content:space-between; align-items:flex-end; gap:6px; }
  #card .vocab-fr{ font-size:14.5px; color: var(--ink-soft); line-height:1.35; }
  .vocab-add-btn{ width:36px; height:36px; border-radius:50%; border:1.5px solid var(--line-strong); background: transparent; color: var(--accent); font-size:20px; line-height:1; cursor:pointer; flex:none; font-family: var(--sans); padding:0; }
  .vocab-add-btn.added{ background: var(--accent-tint); border-color: var(--accent); }

  /* point de grammaire */
  .gram-card{ margin-top: 22px; padding: 22px 20px; }
  .gram-card .cours-point{ font-family: var(--serif); font-weight:700; font-size:30px; line-height:1.3; margin: 8px 0 12px; color: var(--ink); }
  .gram-card .cours-explanation{ font-size:16px; line-height:1.65; color: var(--ink); margin-bottom:14px; }
  .gram-card .examples{ display:flex; flex-direction:column; gap:10px; }
  .gram-card .example{ background: var(--sand); border-radius:16px; padding: 12px 14px; display:block; border:none; }
  .gram-card .example .ex-num{ display:none; }
  .gram-card .example .jp-line-row{ display:flex; align-items:center; gap:8px; }
  .gram-card .example .jp-line{ font-size:21px; font-weight:700; line-height:1.9; background:none; border:none; padding:0; }
  .gram-card .example .romaji{ display:none; }
  .gram-card .example .fr{ font-size:14.5px; color: var(--ink-soft); }
  .gram-card .example .tts-btn{ width:38px; height:38px; background: var(--surface); }

  /* exercices */
  #step-ex .exercise{ display:flex; flex-direction:column; gap:10px; }
  .exercise .ex-label{ order:1; font-size:13px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color: var(--amber); margin:0; }
  .exercise .ex-sentence{ order:2; font-family: var(--serif); font-weight:700; font-size:32px; line-height:1.7; margin:0; background:none; border:none; padding:0; }
  .exercise .ex-prompt{ order:3; font-size:16.5px; color: var(--ink-soft); margin:0; line-height:1.5; }
  .exercise:not(.has-s) .ex-prompt{ order:2; font-family: var(--serif); font-weight:700; font-size:27px; color: var(--ink); line-height:1.4; }
  .exercise .ex-choices{ order:4; display:flex; flex-direction:column; gap:10px; margin-top:8px; }
  .exercise .ex-input-row{ order:4; margin-top:8px; display:flex; gap:10px; flex-wrap:wrap; }
  .exercise .fr{ order:5; font-size:14px; color: var(--ink-soft); }
  .exercise .ex-feedback{ order:6; }
  .ex-choice{ width:100%; text-align:left; min-height:60px; padding: 14px 18px; border-radius:18px; border:1.5px solid var(--line); background: var(--surface); color: var(--ink); font-family: var(--serif); font-weight:700; font-size:21px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .ex-choice:hover:not(:disabled){ border-color: var(--accent); background: var(--surface); }
  .ex-choice:disabled{ cursor:default; opacity:1; }
  .ex-choice.correct{ background: var(--accent-tint); border: 2px solid var(--accent); color: var(--accent); }
  .ex-choice.correct::after{ content:'✓ Bonne réponse'; font-family: var(--sans); font-size:13px; font-weight:700; }
  .ex-choice.incorrect{ background: var(--bad-tint); border: 2px solid color-mix(in srgb, var(--bad) 55%, transparent); color: var(--bad); }
  .ex-choice.incorrect::after{ content:'✕ Ta réponse'; font-family: var(--sans); font-size:13px; font-weight:700; }
  .ex-choice:disabled:not(.correct):not(.incorrect){ opacity:.6; }
  .ex-input-row input, .ex-input-row textarea{ flex:1 1 100%; min-height:56px; border-radius:16px; border:1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font-family: var(--sans); font-size:19px; padding: 12px 16px; }
  .ex-input-row textarea{ min-height:96px; }
  .ex-input-row input:focus, .ex-input-row textarea:focus{ outline:none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .ex-check-btn{ min-height:54px; width:100%; border-radius:16px; border:none; background: var(--accent-deep); color: var(--on-accent); font-family: var(--sans); font-weight:700; font-size:16.5px; cursor:pointer; }
  .ex-check-btn:disabled{ opacity:.45; }
  .ex-feedback{ border-radius:20px; padding:16px 18px; font-size:16px; line-height:1.55; margin-top:6px; background: var(--surface); border:1.5px solid var(--line); }
  .ex-feedback .fb-title{ font-weight:700; font-size:17px; margin-bottom:4px; }
  .ex-feedback.correct{ background: var(--accent-tint); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .ex-feedback.correct .fb-title{ color: var(--accent); }
  .ex-feedback.incorrect{ border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
  .ex-feedback.incorrect .fb-title{ color: var(--bad); }
  .past-ex{ margin-top:22px; padding: 14px 18px; }
  .past-ex summary{ font-weight:700; cursor:pointer; min-height:32px; display:flex; align-items:center; }
  .past-ex .exercise-item{ margin-top:14px; padding-top:14px; border-top:1.5px solid var(--line); }
  .exercise{ background:none; border:none; padding:0; border-radius:0; }
  .exercise-item + .exercise-item{ border:none; margin:0; padding:0; }
  .exercise .ex-sentence{ font-size:29px; }
  #card .turn .jp-line{ font-size:20px; }
  #card .vocab-jp{ font-size:22px; word-break:keep-all; }
  .ex-hint{ order:5; display:flex; align-items:center; gap:8px; font-size:14px; color: var(--ink-soft); }
  .ex-hint svg{ width:18px; height:18px; flex:none; }
  .ex-feedback.incorrect{ background: var(--surface); }

  /* ================= v16 · autres vues ================= */
  .chat-input-row .btn-primary, .eval-nav .btn-primary, .x-toolbar .btn-primary{ width:auto; }
  .chat-input-row{ display:flex; gap:10px; align-items:center; }
  .chat-input-row input{ flex:1; min-height:54px; border-radius:16px; border:1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font-family: var(--sans); font-size:17px; padding:0 16px; }
  .chat-input-row .btn-primary{ min-height:54px; padding: 0 22px; }
  .chat{ background: var(--surface); border:1.5px solid var(--line); border-radius:24px; box-shadow:none; overflow:hidden; }
  .chat-head{ background: var(--sand); border-bottom:none; }
  .chat-title{ font-family: var(--serif); font-weight:700; font-size:22px; }
  .chat-goals li.done{ color: var(--accent); }
  .msg .bubble{ background: var(--sand); border-radius:20px; border:none; }
  .msg.me .bubble{ background: var(--accent-tint); }
  .msg .who{ letter-spacing:.06em; }
  .msg-corr{ background: var(--amber-tint); border-left:3px solid var(--vermilion); border-radius:12px; }
  .mission-stamp{ background: var(--vermilion); color:#FBF3E4; border-radius:999px; font-family: var(--serif); }
  .mission-stamp.soft{ background: var(--sand); color: var(--ink); }
  .garden-note{ display:flex; gap:14px; align-items:center; margin-top:14px; padding: 14px 16px; }
  .garden-note div{ display:flex; flex-direction:column; }
  .garden-note b{ font-size:16px; }
  .garden-note span{ font-size:14px; color: var(--ink-soft); }
  .garden-note .gn-ico{ width:56px; height:56px; flex:none; border-radius:14px; }

  /* missions */
  .scene-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin: 0 0 14px; }
  .scene-tile{ position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left; background: var(--surface); border:1.5px solid var(--line); border-radius:22px; padding: 16px 14px 14px; min-height:168px; cursor:pointer; font-family: var(--sans); color: var(--ink); }
  .scene-tile:hover:not(.locked){ border-color: var(--line-strong); }
  .scene-tile.locked{ opacity:.75; cursor:default; }
  .scene-ico{ width:44px; height:44px; border-radius:50%; background: var(--accent-tint); color: var(--accent); display:flex; align-items:center; justify-content:center; font-family: var(--serif); font-weight:700; font-size:20px; flex:none; }
  .scene-ico.dark{ background: var(--accent-deep); color: var(--on-accent); }
  .scene-tile .hanko.sm{ width:44px; height:44px; font-size:22px; }
  .scene-jp{ font-family: var(--serif); font-weight:700; font-size:21px; line-height:1.3; margin-top:4px; }
  .scene-fr{ font-size:14px; color: var(--ink-soft); line-height:1.35; flex:1; }
  .chip{ display:inline-flex; align-items:center; gap:4px; min-height:28px; padding: 0 12px; border-radius:99px; background: var(--sand); color: var(--ink); font-size:13px; font-weight:700; }
  .chip.ok{ background: var(--accent-tint); color: var(--accent); }
  .chip.later{ background: transparent; border:1.5px dashed var(--line-strong); color: var(--ink-soft); }
  .free-card{ background: var(--accent-tint); border-color: transparent; }
  .free-top{ display:flex; gap:14px; align-items:center; }
  .free-top .scene-jp{ margin:0; }
  .free-top .scene-fr{ flex:none; }
  .topic-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .topic-row .btn-ghost{ background: var(--surface); }
  .mission-log-row{ display:flex; justify-content:space-between; gap:10px; padding: 12px 0; border-bottom:1.5px solid var(--line); font-size:15px; }
  .mission-log-row .mono{ color: var(--ink-soft); font-size:14px; }

  /* fiches */
  .fiche-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .fiche-tile{ display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left; background: var(--surface); border:1.5px solid var(--line); border-radius:22px; padding: 16px 14px; min-height:150px; cursor:pointer; font-family: var(--sans); color: var(--ink); }
  .fiche-name{ font-weight:700; font-size:18px; margin-top:6px; }
  .fiche-sub{ font-size:14px; color: var(--ink-soft); }
  .x-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .x-sheet-head{ margin-bottom: 16px; }
  .x-sheet-jp{ font-family: var(--serif); font-weight:700; font-size:34px; line-height:1.2; }
  .x-sheet-sub{ color: var(--ink-soft); font-size:16px; }
  .x-track{ color: var(--ink-faint); font-size:14px; margin-top:6px; display:flex; flex-wrap:wrap; gap:6px; }
  .x-step{ background: var(--surface); border:1.5px solid var(--line); border-radius:22px; padding: 16px; margin-bottom:12px; }
  .x-line{ border-color: var(--line); }
  .x-jp-line{ font-family: var(--sans); font-weight:700; }
  .x-tag{ border-radius:99px; }
  .x-tip{ background: var(--amber-tint); border-radius:14px; border:none; }
  .x-foot{ text-align:center; color: var(--ink-faint); margin-top:14px; font-size:14px; }

  /* cartes */
  .rv-block{ padding-top:0; }
  .review-stats{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:14px; }
  .review-stat{ background: var(--surface); border:1.5px solid var(--line); border-radius:20px; padding:16px; text-align:center; }
  .review-stat-n{ font-family: var(--serif); font-size:36px; font-weight:700; line-height:1.2; }
  .review-stat-l{ font-size:12.5px; font-weight:700; letter-spacing:.06em; color: var(--ink-soft); margin-top:2px; }
  .review-start-btn{ width:100%; min-height:54px; border-radius:16px; border:none; background: var(--accent-deep); color: var(--on-accent); font-family: var(--sans); font-weight:700; font-size:16.5px; cursor:pointer; }
  .review-start-btn.secondary{ background: transparent; color: var(--ink); border:1.5px solid var(--line-strong); }
  .review-link-btn{ background:none; border:none; color: var(--accent); font-weight:700; text-decoration:underline; cursor:pointer; font-family: var(--sans); font-size:inherit; }
  .tab-panel-intro{ font-size:15.5px; color: var(--ink-soft); line-height:1.6; margin: 0 0 14px; }
  .flashcard{ margin: 6px 0 8px; }
  .flashcard-face{ background: var(--sand); border:none; border-radius:26px; color: var(--ink); }
  .flashcard-jp{ font-family: var(--serif); font-weight:700; }
  .flashcard-fr.big{ font-weight:700; }

(function(){

<script>
/* Kaiwa — moteur du parcours Genki (phase A)
 * Module pur : aucune dépendance au DOM ni à la base. Les fonctions prennent des
 * données et renvoient de nouvelles données (jamais de mutation des entrées).
 * Les règles (seuils, délais de rappel, plafond de charge…) viennent d'un objet de

    version: 1,
    status: 'proposition à valider',
    threshold: 3,                       // état d'acquisition : ouvre les unités qui en dépendent
    loadCap: 8,                         // mots à produire (pondérés) par séance
    recallDays: [1, 3, 7, 21, 60],      // délais des rappels successifs
    stateByGoodRecalls: [3, 3, 4, 4, 5, 5], // état plancher après k bons rappels d'affilée
    ratio: { good: 0.8, partial: 0.5 }, // part de réussite : bon / moyen / raté
    firstLesson: { perfect: 4, good: 3, partial: 2, bad: 1 },
    catchUp: { target: 'L4-U1', newUnitsPerDay: 4, afterTargetPerDay: 2 },
    maxRecallsPerSession: 12,
    decay: { graceDays: 7, stepDays: 14, floor: 2 }, // un rappel en retard fait redescendre l'état

    if (newUnit) {
      var dec = bank.decouverte[newUnit], nEx = mode === 'rattrapage' ? 1 : (cx === 'S' ? 2 : cx === 'M' ? 2 : 3);
      disc = { type: 'notion', sec: 'decouverte', label: 'Découverte', unit: newUnit, notion: dec.notion, exemples: (dec.exemples || []).slice(0, nEx), mots: dec.mots || [], cost: 0 };
      push(disc);
      var vit = findVerif(bank, newUnit);
      if (vit) { verifStep = push(makeStep(vit, pickVariant(vit, sst, rng), rng, { sec: 'verif', label: 'Vérification de compréhension' })); }
      var nTrain = mode === 'rattrapage' ? 3 : cx === 'S' ? 3 : cx === 'M' ? 4 : 6;
      if (mode === 'reduit') nTrain = Math.max(2, nTrain - 1);
      var train = chooseTraining(bank, newUnit, nTrain, vit && vit.id);
      var gi = 0;
      train.forEach(function (it, k) {

      });
      while (gi < gliss.length) { var g2 = gliss[gi++]; g2.sec = 'glisse'; g2.label = 'Un autre point, au passage'; push(g2); }
      if (cx === 'L' && mode !== 'rattrapage') {
        var ci = contrastItem(bank, newUnit, acquired);
        if (ci && !steps.some(function (s) { return s.item === ci.id; })) push(makeStep(ci, pickVariant(ci, sst, rng), rng, { sec: 'contraste', label: 'Contraste avec l’unité précédente', recall: true }));
      }
    }
    // production libre : une seule
    var libItem = null, libFor = null;
    if (newUnit) libItem = (bank.byUnit[newUnit] || []).filter(function (it) { return it.fmt === 'libre'; })[0];
    if (!libItem) {
      var fragUnit = (units.filter(function (d) { return d.fragile; })[0] || units[0]);
      if (fragUnit) libItem = (bank.byUnit[fragUnit.id] || []).filter(function (it) { return it.fmt === 'libre'; })[0];
      if (!libItem) for (var ui = 0; ui < units.length && !libItem; ui++) libItem = (bank.byUnit[units[ui].id] || []).filter(function (it) { return it.fmt === 'libre'; })[0];
    }
    if (libItem) push(makeStep(libItem, 0, rng, { sec: 'libre', label: 'Production libre', recall: !newUnit }));
    push({ type: 'rejeu-gate', sec: 'rejeu', cost: 0 });
    // kanji
    var kjUnits = (newUnit ? [newUnit] : []).concat(units.map(function (d) { return d.id; }));
    var kjItems = [];
    kjUnits.forEach(function (u) { (bank.byUnit[u] || []).forEach(function (it) { if (it.role === 'kj' && kjItems.indexOf(it) < 0) kjItems.push(it); }); });
    var kjN = (mode === 'normal' || mode === 'reduit' || mode === 'rappel') ? 1 : 2;
    if (mode === 'rattrapage') kjN = 2;
    var firstUnit = newUnit ? [newUnit] : [];
    kjItems.sort(function (a, b) {
      var pa = firstUnit.indexOf(a.u) >= 0 ? 0 : 1, pb = firstUnit.indexOf(b.u) >= 0 ? 0 : 1;
      if (pa !== pb) return pa - pb;
      var la = lastSeen(sst, a.id), lb = lastSeen(sst, b.id);

    });
    kjItems.slice(0, kjN).forEach(function (it) { push(makeStep(it, pickVariant(it, sst, rng), rng, { sec: 'kanji', label: 'Kanji' })); });

    var points = steps.reduce(function (a, s) { return a + (s.cost || 0); }, 0);
    return {
      v: 1, date: today, mode: mode, newUnit: newUnit, cx: cx, budget: cx ? BUDGET[cx] : null, nDue: nDue, nPlayed: units.length,
      units: units.map(function (d) { return d.id; }), steps: steps, points: points,
      mission: newUnit ? ((bank.byUnit[newUnit] || []).filter(function (it) { return it.role === 'mis'; })[0] || null) && (bank.byUnit[newUnit].filter(function (it) { return it.role === 'mis'; })[0].id) : null
    };
  }

  /* Étapes de rejeu : chaque item raté revient sous une autre forme */
  function buildRejeu(bank, session, sst, rng, today) {
    var out = [], usedSouche = session.steps.map(function (s) { return s.item; });
    session.steps.forEach(function (st) {
      if (!st.res || st.res.ok || st.type || st.sec === 'rejeu' || st.role === 'kj' || st.fmt === 'libre') return;
      if (st.rejeuDone) return;
      var it = bank.items[st.item], vi = null, item = it;
      var tried = [st.vi].concat(session.steps.filter(function (s) { return s.item === st.item && s !== st; }).map(function (s) { return s.vi; }));
      if (it.v.length > 1) { var cand = []; for (var i = 0; i < it.v.length; i++) if (tried.indexOf(i) < 0) cand.push(i); if (cand.length) vi = cand[Math.floor(rng() * cand.length)]; else { var c2 = []; for (var j = 0; j < it.v.length; j++) if (j !== st.vi) c2.push(j); vi = c2[Math.floor(rng() * c2.length)]; } }
      if (vi == null) {   // autre souche du même piège, dans la même unité
        var alt = (bank.byUnit[st.u] || []).filter(function (x) { return x.id !== st.item && (x.role === 'app' || x.role === 'rap') && x.piege === st.piege && x.piege && x.fmt !== 'libre' && x.fmt !== 'dialogue' && usedSouche.indexOf(x.id) < 0; })[0];
        if (alt) { item = alt; vi = pickVariant(alt, sst, rng); }

    });

  }

  /* ---------------------------------------------------------------- correction */
  /* answer selon le format :
   *  choix : index dans step.choices ; saisie : texte ; ordre : tableau de tuiles ; assoc : { gauche: droite } ;
   *  tri : tableau ; dialogue : tableau de textes (une réponse par réplique) */
  function expectedText(st) {

    if (f === 'assoc') return v.pairs.map(function (p) { return p[0] + ' = ' + p[1]; }).join(' ; ');
    if (f === 'tri') return v.items.map(function (p) { return p[0] + ' → ' + p[1]; }).join(' ; ');
    if (f === 'dialogue') return v.steps.map(function (s, i) { return (i + 1) + ') ' + s.a; }).join('  ');

  }
  function grade(st, answer) {
    var v = st.v, f = st.fmt, res = { ok: false, expected: expectedText(st), chosen: null, err: null, why: v.w || '' };
    if (st.choices) {
      var c = st.choices[answer];
      res.ok = !!(c && c.right); res.chosen = c ? c.t : null; res.err = c && !c.right ? c.err : null;
      return res;
    }
    if (f === 'ordre') { res.ok = accepts([v.a].concat(v.ok || []), (answer || []).join('')); res.chosen = (answer || []).join(' '); return res; }
    if (f === 'assoc') {
      var okAll = v.pairs.every(function (p) { return answer && answer[p[0]] === p[1]; });
      res.ok = okAll; res.wrong = v.pairs.filter(function (p) { return !(answer && answer[p[0]] === p[1]); }).map(function (p) { return p[0]; });
      return res;
    }
    if (f === 'tri') {
      var wrong = [];
      v.items.forEach(function (p, i) { if (!answer || answer[i] !== p[1]) wrong.push(i); });
      res.ok = wrong.length === 0; res.wrong = wrong; return res;
    }
    if (f === 'dialogue') {
      var per = v.steps.map(function (s, i) { return accepts([s.a].concat(s.ok || []), answer && answer[i]); });
      res.per = per; res.ok = per.every(Boolean); res.chosen = (answer || []).join(' / ');
      return res;
    }
    res.ok = accepts([v.a].concat(v.ok || []), answer);
    res.chosen = String(answer == null ? '' : answer);
    return res;
  }
  function gradeDialogueStep(st, i, text) {
    var s = st.v.steps[i];
    return { ok: accepts([s.a].concat(s.ok || []), text), expected: s.a, why: s.w || '' };
  }

  /* ---------------------------------------------------- production libre (IA) */
  function librePrompt(st, text) {
    var crit = (st.v.criteres || []).map(function (c, i) { return (i + 1) + '. ' + c; }).join('\n');
    return 'Tu corriges la production écrite d’un apprenant francophone de japonais (niveau N5, manuel Genki I). Il vient de travailler : ' + st.et + '.\n'

      + 'Exemple de bonne production : ' + kanjiForm(st.v.modele || '') + '\n\n'
      + 'Réponds UNIQUEMENT par un objet JSON valide : {"criteres":[{"c":"critère recopié","etat":"solide" ou "a_fixer","note":"1 phrase courte en français : pourquoi, avec la forme corrigée si besoin"}],"fautes":[{"extrait":"morceau EXACT, recopié caractère pour caractère, de la production de l’apprenant qui contient une faute","note":"pourquoi c’est faux et la forme correcte, en français, 1 phrase"}],"corrige":"la production de l’apprenant corrigée a minima, en japonais","resume":"1 phrase d’encouragement ou de repère, sans note chiffrée"}. "fautes" est une liste vide si tout est correct ; n’y mets que de vraies fautes (grammaire, particule, forme du verbe, vocabulaire), pas des choix de style.\n'
      + 'Règles : un seul objet "criteres" par critère, dans le même ordre ; sois exigeant sur le critère mais indulgent sur ce qui n’est pas encore au programme (kanji, particules non étudiées) ; jamais de score ni de pourcentage.';
  }
  function libreScore(crit) {
    var arr = crit || [];
    if (!arr.length) return 0.5;
    var solid = arr.filter(function (c) { return c.etat === 'solide'; }).length;
    return solid / arr.length;
  }

  /* ------------------------------------------------------------ bilan et suivi */
  function stepResultKind(st) { return st.res ? (st.res.ok ? 1 : 0) : null; }

  /* Termine la séance : résultats par unité, état de la séance (vus, pièges fragiles, kanji), bilan qualitatif.
   * ctx : { bank, sst, today } */
  function finalize(session, ctx) {
    var bank = ctx.bank, sst = normSState(ctx.sst), today = ctx.today, steps = session.steps.filter(function (s) { return !s.type; });

      if (s.role !== 'kj') { var u = U(s.u); u.ok += value; u.n += 1; }
      var key = pieceKey(s);
      if (s.role !== 'kj' && s.fmt !== 'libre') {

        else if (!fragSeen[lb]) { fragSeen[lb] = 1; fragile.push(lb + (s.rejeuRes ? (s.rejeuRes.ok ? ' (rejoué, réussi)' : ' (rejoué, encore raté)') : '')); }
      }
      // séries d'échecs par piège

        if (s.res.ok) { sst.streak[key] = 0; delete sst.fragile[key]; }
        else {
          sst.streak[key] = (sst.streak[key] || 0) + 1;
          if (s.rejeuRes) {
            if (s.rejeuRes.ok) { /* repris : on garde la série à 1 */ }
            else sst.streak[key] = (sst.streak[key] || 0) + 1;
          }
          if ((sst.streak[key] || 0) >= 2) sst.fragile[key] = today;
        }
      }
    });
    // 3) souches vues
    session.steps.forEach(function (s) { if (!s.type && s.res) markSeen(sst, s.item, s.vi, today); });
    // 4) kanji
    var seenKanji = {};
    session.steps.forEach(function (s) {
      if (s.type || !s.res) return;
      var chars = [];
      function add(t) { kanjiChars(t).forEach(function (c) { if (bank.kanjiTested[c] && chars.indexOf(c) < 0) chars.push(c); }); }
      add(s.v.q || '');
      (s.choices || []).forEach(function (c) { add(c.t); });
      (s.v.steps || []).forEach(function (x) { add(x.a); add(x.them); });
      add(s.v.a || '');
      chars.forEach(function (c) {
        var k = sst.kanji[c] = sst.kanji[c] || { ok: 0, days: [], miss: 0 };
        if (s.res.ok) { k.ok += 1; k.miss = 0; if (k.days.indexOf(today) < 0) k.days.push(today); }
        else { k.miss = (k.miss || 0) + 1; if (k.miss >= 2) { k.ok = 0; k.days = []; k.miss = 0; } }
      });
    });
    var points = session.steps.reduce(function (a, s) { return a + (!s.type && s.res ? (s.cost || 0) : 0); }, 0);
    sst.sessions = (sst.sessions || []).concat([{ date: today, mode: session.mode, newUnit: session.newUnit || null, points: points, units: order }]).slice(-30);
    var results = order.map(function (id) {

  }

  function emptyStepsLeft(session) { return session.steps.filter(function (s) { return !s.type && !s.res; }).length; }

  return {
    COST: COST, BUDGET: BUDGET, parse: parse, kana: kana, kanjiForm: kanjiForm, kanjiChars: kanjiChars, rubyHtml: rubyHtml, norm: norm, accepts: accepts,
    buildBank: buildBank, emptySState: emptySState, normSState: normSState, kanjiValid: kanjiValid, showFuriganaFn: showFuriganaFn,

<script>

  }

  /* ---------- séance : accueil ---------- */
  function renderHome(){

      if (it.support && idx.placement._meta.meta.supports[it.support]) { var sp = idx.placement._meta.meta.supports[it.support]; o += '<div class="kg-support"><b>' + h(sp.titre) + '</b><div class="kg-jp" style="white-space:pre-line">' + h(sp.texte) + '</div></div>'; }
      o += '<p class="kg-q">' + h(it.enonce) + '</p>';

      } else if (it.type === 'association') {
        var rights = shuffle(it.paires.map(function(p){ return p.droite; }), id.charCodeAt(1) * 31 + id.charCodeAt(2));
        o += '<div class="kg-assoc">' + it.paires.map(function(p, k){ return '<label class="kg-arow"><span class="kg-jp">' + h(p.gauche) + '</span><select data-kg-as="' + k + '" class="kg-select"><option value="">…</option>' + rights.map(function(r){ return '<option value="' + h(r) + '">' + h(r) + '</option>'; }).join('') + '</select></label>'; }).join('') + '</div>'
          + '<button type="button" class="btn-primary" id="kg-asend" style="margin-top:12px">Valider</button>';
      } else {
        o += '<div class="kg-answer"><input id="kg-in" type="text" lang="ja" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Ta réponse"><button type="button" class="btn-primary" id="kg-send">Valider</button></div>';
      }

    } else if (t.stage === 'item' && it && it.section === 'E') {
      var eItems = t.order.filter(function(x){ return idx.items[x].section === 'E'; });
      o += '<div class="kg-prog">' + SEC.E + ' · ' + (eItems.indexOf(id) + 1) + ' / ' + eItems.length + '</div><p class="kg-q">' + h(it.enonce) + '</p>'

    var q = body.querySelector('#kg-tquit'); if (q) q.addEventListener('click', async function(){ if (t.stage !== 'result' && Object.keys(t.answers).length) await saveEntry(); leaveTest(); });
    var bind = function(sel, fn){ var e = body.querySelector(sel); if (e) e.addEventListener('click', fn); };
    bind('#kg-tstart', function(){ t.stage = 'item'; renderTest(); });
    bind('#kg-tcont', function(){ t.stage = 'item'; renderTest(); });
    bind('#kg-tcont2', function(){ t.noEarly = true; t.stage = 'item'; renderTest(); });
    bind('#kg-tlater', async function(){ await saveEntry(); leaveTest(); });
    bind('#kg-tstop', async function(){ await saveEntry(); leaveTest(); });
    body.querySelectorAll('[data-kg-copt]').forEach(function(b){ b.addEventListener('click', function(){ record({ t: it.options[+b.getAttribute('data-kg-copt')] }); }); });
    var inp = body.querySelector('#kg-in'), send = body.querySelector('#kg-send');
    if (inp) { inp.focus(); inp.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); record({ t: inp.value }); } }); }
    if (send) send.addEventListener('click', function(){ record({ t: inp.value }); });
    bind('#kg-asend', function(){ var pairs = {}; body.querySelectorAll('[data-kg-as]').forEach(function(s){ pairs[it.paires[+s.getAttribute('data-kg-as')].gauche] = s.value; }); record({ pairs: pairs }); });
    bind('#kg-skip', function(){ if (it.section === 'E') record({ t: '', skipped: true }); else record(it.type === 'association' ? { pairs: {} } : { t: '' }); });
    bind('#kg-fsend', function(){ var v = (body.querySelector('#kg-free').value || '').trim(); if (v) gradeFree(v); });
  }
  async function record(a){
    var t = tst, id = t.order[t.i], it = loaded.idx.items[id];
    t.answers[id] = a;
    var nextId = t.order[t.i + 1];
    t.i++;
    await saveEntry();
    if (!nextId) return finishTest();
    if (it.section === 'A' && id === 'A05' && !t.noEarly && E.earlyStop(scoredMap())) { t.stage = 'early'; return renderTest(); }
    if (E.testSession(loaded.idx.items[nextId]) === 2 && E.testSession(it) === 1 && !t.resumed2) { t.stage = 'pause'; t.resumed2 = true; return renderTest(); }
    renderTest();
  }
  async function gradeFree(text){
    var t = tst, id = t.order[t.i], it = loaded.idx.items[id], g = it.grille_correction || [];
    t.busy = true; renderTest();
    var levels = null;
    try {
      var sample = await claude.use('sample');
      if (sample) {
        var prompt = 'Tu corriges un exercice de production libre en japonais pour un débutant (niveau Genki I, leçons 1 à 3). Consigne donnée : ' + it.enonce + '\nTexte de l’apprenant : ' + text
          + '\nPour chaque critère ci-dessous, réponds par un niveau parmi "solide", "fragile", "a_retravailler" selon la grille. Sois indulgent sur le vocabulaire choisi, regarde la forme.\n'
          + g.map(function(c, k){ return (k + 1) + '. ' + c.critere + ' — solide : ' + c.solide + ' ; fragile : ' + c.fragile + ' ; à retravailler : ' + c.a_retravailler; }).join('\n')
          + '\nRéponds uniquement par un objet JSON {"niveaux": [' + g.map(function(){ return '"..."'; }).join(', ') + ']} avec exactement ' + g.length + ' valeurs, dans l’ordre.';
        var r = await sample.json(prompt, { modelTier: 'quick', cache: false });
        if (r && Array.isArray(r.niveaux) && r.niveaux.length === g.length) levels = r.niveaux;
      }
    } catch (e) { levels = null; }
    t.busy = false;
    if (levels) g.forEach(function(c, k){ var n = levels[k]; if (n !== 'solide' && n !== 'fragile' && n !== 'a_retravailler') n = 'fragile'; t.free.push({ item: id, critere: c.critere, niveau: n, unites: c.unites || [] }); });
    t.answers[id] = { t: text, graded: !!levels };
    var nextId = t.order[t.i + 1]; t.i++; await saveEntry();
    if (!nextId) return finishTest(); renderTest();
  }
  async function finishTest(){
    var idx = loaded.idx, t = tst, today = E.todayStr();
    var scored = scoredMap(), agg = E.aggregateTest(scored), results = {};
    Object.keys(agg.obs).forEach(function(u){ results[u] = agg.results[u] || 0; });
    var seeded = E.seedFromTest(idx, results, today, E.freeCounts(t.free));
    var S = loaded.hasState ? E.mergeSeed(loaded.state, seeded) : seeded;
    var fb = E.entryFeedback(idx, seeded, { scored: scored, items: idx.items, free: t.free, agg: agg });
    var verdict = E.entryVerdict(idx, seeded);
    var missed = Object.keys(scored).filter(function(id){ return !scored[id].ok && scored[id].counts; }).slice(0, 8);
    var ok = await persist(S, { type: 'entry-test', open: verdict.open });
    await saveEntry({ done: true, completedAt: today, startedAt: t.startedAt });
    var o = '<h3>Ton point de départ</h3>' + fb.map(function(x){ return '<p class="kg-note">' + h(x) + '</p>'; }).join('')
      + '<p class="kg-know">' + (verdict.open ? 'L4-U1 est ouvert.' : 'Point d’entrée : ' + h(verdict.entryPoint) + ' · ' + h(title(verdict.entryPoint)) + '.') + '</p>';
    if (missed.length) o += '<h3>À revoir</h3><ul class="kg-list">' + missed.map(function(id){ var it = idx.items[id], r = scored[id];
      return '<li>' + h(it.enonce) + '<small>→ ' + h(r.expected) + (it.explication_erreur ? ' — ' + h(it.explication_erreur) : '') + '</small></li>'; }).join('') + '</ul>';
    if (!ok) o += '<div class="kg-err">' + h(toast) + '</div>';
    o += '<button type="button" class="btn-primary" id="kg-tend" style="margin-top:16px">Voir ma séance du jour</button>';
    t.stage = 'result'; t.resultHtml = o; homeCard(); renderPathIfVisible(); renderTest();
    var e = body.querySelector('#kg-tend'); if (e) e.addEventListener('click', function(){ tst = null; confirmQuit = false; goView('home'); });
  }
})();

(function(){

    { view: 'missions', nav: 'missions', t: 'Missions', p: 'Des conversations en situation : restaurant, magasin, chemin… Si la mission n’est pas atteinte, tu peux réessayer demain.' },
    { view: 'fiches', nav: 'fiches', t: 'Fiches', p: 'Ton aide-mémoire : phrases du quotidien, fiche voyage, mots appris et notions des unités déjà jouées.' },
    { view: 'home', nav: null, t: 'Ta progression', p: 'Chaque unité a cinq points qui se remplissent, jamais de note chiffrée. Les rappels reviennent à intervalles croissants. Tu peux quitter une séance à tout moment : rien n’est perdu. Cette visite se rejoue depuis les réglages.' }
  ];
  function el(t, c, h){ var e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; }
  function navBtn(v){ return document.querySelector('#viewnav button[data-view="' + v + '"]'); }
  function show(v){ try { if (window.__kgShow) window.__kgShow(v); } catch (e) {} }
  function mark(){
    try { localStorage.setItem(KEY, '1'); } catch (e) {}
    if (db) { try { prefs = Object.assign({}, prefs, { tourSeen: new Date().toISOString() }); var r = db.doc('learn/prefs').set(prefs); if (r && r.catch) r.catch(function(){}); } catch (e) {} }
  }
  function end(){
    if (lastHL) lastHL.classList.remove('kz-tour-hl'); lastHL = null;
    document.body.classList.remove('kz-touring');
    if (root) { root.remove(); root = null; }

  function draw(){
    var s = STEPS[step], last = step === STEPS.length - 1;
    show(s.view);
    if (lastHL) lastHL.classList.remove('kz-tour-hl'); lastHL = null;
    if (s.nav) { lastHL = navBtn(s.nav); if (lastHL) lastHL.classList.add('kz-tour-hl'); }

      + '<button type="button" class="btn-primary kz-next" id="kz-next">' + (last ? 'C’est parti' : 'Suivant') + '</button></div></div>';
    var sk = root.querySelector('#kz-skip'); if (!last) sk.addEventListener('click', end); else sk.style.display = 'none';
    var pv = root.querySelector('#kz-prev'); if (pv) pv.addEventListener('click', function(){ step--; draw(); });
    root.querySelector('#kz-next').addEventListener('click', function(){ if (last) end(); else { step++; draw(); } });
    root.querySelector('#kz-next').focus();
  }
  function start(){
    if (root) return;
    step = 0; root = el('div', 'kz-tour'); document.body.appendChild(root); document.body.classList.add('kz-touring');
    document.addEventListener('keydown', function esc(e){ if (e.key === 'Escape' && root) { end(); document.removeEventListener('keydown', esc); } });
    draw();
  }
  window.__kzTour = start;
  var btn = document.getElementById('kz-tour-open');
  if (btn) btn.addEventListener('click', function(){ var s = document.getElementById('settings-back'); if (s) s.classList.remove('open'); start(); });
  (async function(){
    var seen = false; try { seen = localStorage.getItem(KEY) === '1'; } catch (e) {}
    try { db = await claude.use('db'); if (db) { var sn = await db.doc('learn/prefs').get(); prefs = sn.exists ? sn.data() : {}; if (prefs.tourSeen) seen = true; } } catch (e) {}
    if (!seen) setTimeout(start, 700);
  })();
})();
</script>

<script>
(function(){
  // ---- theme toggle (system / light / dark), remembered per browser ----
  const THEME_KEY = 'kaiwa-theme-pref';
  function getStoredTheme(){
    try{ return localStorage.getItem(THEME_KEY); }catch(e){ return null; }
  }
  function setStoredTheme(v){
    try{ if (v === 'system') localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, v); }catch(e){}
  }
  function applyTheme(v){
    if (v === 'light' || v === 'dark') document.documentElement.setAttribute('data-theme', v);
    else document.documentElement.removeAttribute('data-theme');
    document.querySelectorAll('.theme-toggle button').forEach(b => b.classList.toggle('active', b.dataset.theme === v));
  }
  let themePref = getStoredTheme() || 'system';
  applyTheme(themePref);
  document.querySelectorAll('.theme-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      themePref = btn.dataset.theme;
      setStoredTheme(themePref);
      applyTheme(themePref);
    });
  });

  const todayEl = document.getElementById('today-date');
  todayEl.textContent = new Date().toLocaleDateString('fr-FR', { weekday:'short', day:'numeric', month:'short' });

  const cardEl = document.getElementById('card');
  const historyWrap = document.getElementById('history-wrap');
  const stampRow = document.getElementById('stamp-row');
  const statLesson = document.getElementById('stat-lesson');
  const statLevel = document.getElementById('stat-level');
  const statDone = document.getElementById('stat-done');

  function esc(s){ return String(s == null ? '' : s); }
  function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }
  function normalize(s){ return String(s||'').trim().replace(/\s+/g,'').replace(/。$/,''); }

  // ---- text-to-speech (browser-native, no external service) ----
  const ttsSupported = (typeof window !== 'undefined' && 'speechSynthesis' in window);
  // Strips <ruby>/<rt> furigana markup (and any other tags) down to plain speakable text.
  function plainJp(html){
    return String(html || '')
      .replace(/<rt>[\s\S]*?<\/rt>/g, '')
      .replace(/<\/?ruby>/g, '')
      .replace(/<[^>]+>/g, '');
  }
  // Si une lecture en kana est connue, on la fait prononcer (évite 良い → « yoi » au lieu de « ii »).
  function speakFor(jp, reading){
    const r = String(reading || '').trim();
    return (r && /^[\u3040-\u30ff\u30fc\s・]+$/.test(r)) ? r : jp;
  }
  function ttsBtnHtml(jpHtml, extraClass, reading){
    if (!ttsSupported) return '';
    return `<button type="button" class="tts-btn${extraClass ? ' ' + extraClass : ''}" data-jp="${escAttr(speakFor(plainJp(jpHtml), reading))}" title="Écouter la prononciation" aria-label="Écouter">${SVG_SPEAKER}</button>`;
  }

  // ---- voice selection: the browser usually offers several Japanese voices of
  // very different quality (local "compact" ones vs. cloud/"Natural" ones) — pick
  // the best-sounding one by default, and let the person override & remember it.
  const TTS_VOICE_KEY = 'kaiwa-tts-voice';
  let ttsVoices = [];
  function getStoredVoiceName(){
    try{ return localStorage.getItem(TTS_VOICE_KEY); }catch(e){ return null; }
  }
  function setStoredVoiceName(name){
    try{ if (name) localStorage.setItem(TTS_VOICE_KEY, name); else localStorage.removeItem(TTS_VOICE_KEY); }catch(e){}
  }
  // ---- speaking speed (slider, remembered on this device) ----
  const TTS_RATE_KEY = 'kaiwa-tts-rate';
  const TTS_RATE_DEFAULT = 0.92;
  function clampRate(r){ return Math.min(1.3, Math.max(0.5, r)); }
  function getStoredRate(){
    try{
      const raw = localStorage.getItem(TTS_RATE_KEY);
      const r = raw == null ? NaN : parseFloat(raw);
      return isFinite(r) ? clampRate(r) : TTS_RATE_DEFAULT;
    }catch(e){ return TTS_RATE_DEFAULT; }
  }
  function setStoredRate(r){
    try{ localStorage.setItem(TTS_RATE_KEY, String(r)); }catch(e){}
  }
  let ttsRate = getStoredRate();
  function rateLabel(r){ return String(Math.round(r * 100) / 100).replace('.', ',') + '×'; }
  const VOICE_QUALITY_HINTS = ['natural', 'online', 'neural', 'google', 'kyoko', 'o-ren', 'nanami', 'keita', 'sayaka', 'haruka'];
  function scoreVoice(v){
    const name = (v.name || '').toLowerCase();
    let score = 0;
    VOICE_QUALITY_HINTS.forEach((hint, i) => { if (name.includes(hint)) score += (VOICE_QUALITY_HINTS.length - i); });
    if (v.localService === false) score += 3; // cloud voices usually beat the on-device compact ones
    return score;
  }
  function pickDefaultVoice(){
    if (!ttsVoices.length) return null;
    const stored = getStoredVoiceName();
    if (stored){
      const match = ttsVoices.find(v => v.name === stored);
      if (match) return match;
    }
    return ttsVoices.slice().sort((a, b) => scoreVoice(b) - scoreVoice(a))[0];
  }
  function renderVoicePicker(){
    const row = document.getElementById('voice-picker-row');
    const select = document.getElementById('voice-select');
    if (!row || !select) return;
    if (!ttsVoices.length){ row.style.display = 'none'; return; }
    row.style.display = 'flex';
    const current = pickDefaultVoice();
    select.innerHTML = ttsVoices.map(v => {
      const label = v.name.replace(/^(Google|Microsoft)\s+/, '');
      return `<option value="${escAttr(v.name)}"${current && v.name === current.name ? ' selected' : ''}>${esc(label)}</option>`;
    }).join('');
  }
  function refreshVoiceList(){
    if (!ttsSupported) return;
    const all = window.speechSynthesis.getVoices() || [];
    ttsVoices = all.filter(v => (v.lang || '').toLowerCase().startsWith('ja'));
    renderVoicePicker();
  }
  if (ttsSupported){
    const rateRow = document.getElementById('rate-row');
    const rateRange = document.getElementById('rate-range');
    const rateVal = document.getElementById('rate-val');
    if (rateRow && rateRange && rateVal){
      rateRow.style.display = 'flex';
      rateRange.value = String(ttsRate);
      rateVal.textContent = rateLabel(ttsRate);
      rateRange.addEventListener('input', (e) => {
        ttsRate = clampRate(parseFloat(e.target.value) || TTS_RATE_DEFAULT);
        rateVal.textContent = rateLabel(ttsRate);
        setStoredRate(ttsRate);
      });
      // on release: let the person hear the new speed right away
      rateRange.addEventListener('change', () => speakJp('こんにちは、これはテストです。'));
    }
    refreshVoiceList();
    window.speechSynthesis.onvoiceschanged = refreshVoiceList;
    const voiceSelect = document.getElementById('voice-select');
    if (voiceSelect){
      voiceSelect.addEventListener('change', (e) => setStoredVoiceName(e.target.value));
    }
  }

  function speakJp(text, btn, mul){
    if (!ttsSupported || !text) return;
    try{
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ja-JP';
      utter.rate = Math.max(0.3, ttsRate * (mul || 1));
      const voice = pickDefaultVoice();
      if (voice) utter.voice = voice;
      if (btn){
        btn.classList.add('speaking');
        const clear = () => btn.classList.remove('speaking');
        utter.onend = clear;
        utter.onerror = clear;
      }
      window.speechSynthesis.speak(utter);
    }catch(e){ /* TTS unavailable in this browser */ }
  }
  document.addEventListener('click', (e) => {
    const btn = e.target.closest ? e.target.closest('.tts-btn') : null;
    if (!btn) return;
    speakJp(btn.dataset.jp || '', btn);
  });

  let entriesRef;
  let exerciseDoneThisView = false; // set true once an exercise is checked during this page view

  // ---- flashcard review box (vocab picked from lessons, Leitner-style spaced repetition) ----
  let flashcardsRef;
  let allFlashcards = [];
  let flashcardsReady = false;
  let reviewSession = null; // { queue: [ids], index, results: {good, bad} } or null when idle
  let historyDocsById = {};
  const LEITNER_INTERVAL_DAYS = [0, 0, 2, 4, 8, 16]; // indexed by box 1..5

  function dueFlashcards(){
    const today = todayStr();
    return allFlashcards.filter(f => (f.nextReview || '') <= today);
  }

  function buildExamplesHtml(examples){
    return (examples||[]).map((ex, idx) => `
      <div class="example">
        <div class="ex-num mono">${String(idx + 1).padStart(2, '0')}</div>
        <div class="ex-body">
          <div class="jp-line-row">
            <div class="jp-line">${ex.jp || ''}</div>
            ${ttsBtnHtml(ex.jp)}
          </div>
          <div class="romaji">${ex.romaji || ''}</div>
          <div class="fr">${ex.fr || ''}</div>
        </div>
      </div>`).join('');
  }

  // Stable, ASCII-only doc id for a vocab word (Japanese text can't be a doc id directly).
  function flashcardId(word){
    const bytes = new TextEncoder().encode(String(word || ''));
    let hex = '';
    bytes.forEach(b => { hex += b.toString(16).padStart(2, '0'); });
    return 'w_' + hex;
  }
  function todayStr(){
    const dt = new Date();
    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  }
  function addDays(dateStr, n){
    const dt = new Date(dateStr + 'T00:00:00');
    dt.setDate(dt.getDate() + n);
    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  }
  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildVocabHtml(vocab, ctx){
    ctx = ctx || {};
    const addedIds = ctx.addedIds || new Set();
    return (vocab||[]).map(v => {
      const fid = flashcardId(v.jp);
      const isAdded = addedIds.has(fid);
      return `
      <div class="vocab-item">
        <div class="vocab-jp-row">
          <div class="vocab-jp">${v.jp}<span class="reading">${v.reading || ''}</span></div>
          ${ttsBtnHtml(v.jp, '', v.reading)}
        </div>
        <div class="vocab-cut"><span class="notch"></span><span class="dash"></span><span class="notch"></span></div>
        <div class="vocab-fr-row">
          <div class="vocab-fr">${v.fr || ''}</div>
          <button type="button" class="vocab-add-btn${isAdded ? ' added' : ''}" data-fid="${fid}" data-jp="${escAttr(v.jp)}" data-reading="${escAttr(v.reading||'')}" data-fr="${escAttr(v.fr||'')}" title="${isAdded ? 'Déjà dans ta boîte de révision' : 'Ajouter à la boîte de révision'}">${isAdded ? '✓' : '+'}</button>
        </div>
      </div>`;
    }).join('');
  }

  // Wires "+" buttons found inside containerEl to add that word to the flashcard box.
  function wireVocabAddButtons(containerEl, sourceDate){
    containerEl.querySelectorAll('.vocab-add-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (btn.classList.contains('added')) return;
        btn.disabled = true;
        const fid = btn.dataset.fid;
        try{
          await flashcardsRef.doc(fid).set({
            jp: btn.dataset.jp,
            reading: btn.dataset.reading,
            fr: btn.dataset.fr,

            addedAt: new Date().toISOString(),
            sourceDate: sourceDate || ''
          });
          btn.classList.add('added');
          btn.textContent = '✓';
          btn.title = 'Déjà dans ta boîte de révision';
